name: Release Watchdog

# Deploy-blindness alarm. A push can succeed-then-silently-not-roll-out (Fly
# machine wedged, health check flaked into a half-deploy, a revert that never
# redeployed). Nothing watches for that today. This job runs hourly, compares
# the tip of origin/main to the SHA the live site actually reports at
# /api/version, and pings DEPLOY_ALERT_WEBHOOK if they diverge — so a stale
# release surfaces on Tom's phone within the hour instead of when a customer
# notices.

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17 (off the top-of-hour stampede)
  workflow_dispatch: {} # allow a manual run from the Actions tab

concurrency:
  group: release-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # in-flight deploy suppression queries the deploy.yml runs

jobs:
  check-release-freshness:
    name: Compare origin/main to live deployed SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1 # we only need the tip of the default branch

      - name: Resolve expected vs deployed SHA
        id: resolve
        run: |
          set -uo pipefail

          # Expected: the commit GitHub considers the tip of main right now.
          EXPECTED="$(git rev-parse HEAD)"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Expected (origin/main tip): $EXPECTED"

          # Deployed: the SHA the live server bakes in. /api/version returns
          # { "sha": "<git-sha>" } (server/routes.ts → VITE_GIT_SHA, set from
          # the Dockerfile GIT_SHA build-arg the deploy passes through). This
          # is auth-free and Cloudflare-fronted, so we test the real path.
          RESP="$(curl --fail --silent --show-error --max-time 20 \
            "https://acreos.io/api/version" || echo '__CURL_FAILED__')"
          echo "Raw /api/version response: $RESP"

          if [ "$RESP" = "__CURL_FAILED__" ]; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            echo "deployed=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DEPLOYED="$(printf '%s' "$RESP" | jq -r '.sha // "unknown"')"
          echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"
          echo "Deployed (live /api/version): $DEPLOYED"

          # "unknown" means the running build wasn't given a GIT_SHA — itself a
          # deploy-hygiene problem worth surfacing.
          if [ "$DEPLOYED" = "unknown" ] || [ -z "$DEPLOYED" ]; then
            echo "status=unknown-sha" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOYED" = "$EXPECTED" ]; then
            echo "status=match" >> "$GITHUB_OUTPUT"
          else
            # Divergence is NORMAL while the deploy pipeline is still rolling
            # the new tip out (test gate + build + Fly rollout ≈ 20–40 min;
            # the hourly tick regularly lands inside that window — 2026-07-11
            # the founder got a STALE page two minutes after the deploy
            # STARTED). Before alarming, ask GitHub whether a deploy.yml run
            # for the expected SHA is queued or in progress; if so this is a
            # deploy in flight, not a stale release. A FAILED or absent
            # deploy still alerts — that is the wolf this dog exists for.
            DEPLOY_RUNS="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${EXPECTED}&per_page=1" \
              || echo '{}')"
            RUN_STATUS="$(printf '%s' "$DEPLOY_RUNS" | jq -r '.workflow_runs[0].status // "none"')"
            echo "Deploy run for expected SHA: status=$RUN_STATUS"
            if [ "$RUN_STATUS" = "queued" ] || [ "$RUN_STATUS" = "in_progress" ] || [ "$RUN_STATUS" = "waiting" ] || [ "$RUN_STATUS" = "pending" ]; then
              echo "status=deploy-in-flight" >> "$GITHUB_OUTPUT"
            else
              echo "status=diverged" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "Status:   ${{ steps.resolve.outputs.status }}"
          echo "Expected: ${{ steps.resolve.outputs.expected }}"
          echo "Deployed: ${{ steps.resolve.outputs.deployed }}"

      # Alert on anything that isn't a clean match. Uses the SAME secret +
      # POST shape as deploy.yml's failure notifier (ntfy or Slack/Discord).
      #
      # Tier 1E (elevation blueprint): when the secret is UNSET this step
      # FAILS with an explicit error instead of silently printing to a log
      # nobody reads — a watchdog that can't bark is a lie.
      #
      # 🔑 FOUNDER ACTION: gh secret set DEPLOY_ALERT_WEBHOOK --body "<url>"
      - name: Alert on stale / unreachable release
        # deploy-in-flight is the healthy merge→rollout window — no alert;
        # the NEXT hourly tick alarms if the deploy failed to land.
        if: steps.resolve.outputs.status != 'match' && steps.resolve.outputs.status != 'deploy-in-flight'
        env:
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          STATUS: ${{ steps.resolve.outputs.status }}
          EXPECTED: ${{ steps.resolve.outputs.expected }}
          DEPLOYED: ${{ steps.resolve.outputs.deployed }}
        run: |
          case "$STATUS" in
            diverged)    HEADLINE="⚠️ AcreOS STALE RELEASE — live site is behind origin/main";;
            unreachable) HEADLINE="🚨 AcreOS /api/version UNREACHABLE — site may be down";;
            unknown-sha) HEADLINE="⚠️ AcreOS live build reports no GIT_SHA (deploy hygiene)";;
            *)           HEADLINE="⚠️ AcreOS release watchdog: $STATUS";;
          esac
          MSG="$HEADLINE. expected=${EXPECTED:0:7} deployed=${DEPLOYED} — https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "$MSG"
          if [ -z "$DEPLOY_ALERT_WEBHOOK" ]; then
            echo "::error title=DEPLOY_ALERT_WEBHOOK secret is NOT set::The release watchdog detected a problem ($STATUS) and could NOT alert anyone — the alert path is unwired. 🔑 Founder: gh secret set DEPLOY_ALERT_WEBHOOK --body \"https://ntfy.sh/<private-topic>\" (or a Slack/Discord incoming-webhook URL)."
            exit 1
          fi
          # ntfy renders the raw body as the message — send PLAIN TEXT so the
          # phone shows clean copy, not literal {"text":...}. JSON fallback for
          # Slack/Discord webhooks.
          if echo "$DEPLOY_ALERT_WEBHOOK" | grep -qi "ntfy"; then
            curl --fail --silent --show-error --max-time 15 \
              -H "Title: AcreOS release watchdog" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -d "$MSG" \
              "$DEPLOY_ALERT_WEBHOOK" \
              || echo "Watchdog webhook POST failed — investigate."
          else
            curl --fail --silent --show-error --max-time 15 \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$MSG" '{text:$t, message:$t, content:$t}')" \
              "$DEPLOY_ALERT_WEBHOOK" \
              || echo "Watchdog webhook POST failed — investigate."
          fi

      # Tier 1E — alert-spine configuration gate, evaluated on EVERY hourly
      # run (even when the release matches). The blueprint's rule: workflows
      # FAIL, not silently skip, when DEPLOY_ALERT_WEBHOOK is unset. The
      # watchdog's entire purpose is delivering an out-of-band alert; running
      # green with an unwired alert path is a false sense of safety.
      - name: Alert spine configured (DEPLOY_ALERT_WEBHOOK)
        if: always()
        env:
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_ALERT_WEBHOOK" ]; then
            echo "::error title=DEPLOY_ALERT_WEBHOOK secret is NOT set::The release watchdog cannot deliver alerts — it is decorative until this secret exists. 🔑 Founder: gh secret set DEPLOY_ALERT_WEBHOOK --body \"https://ntfy.sh/<private-topic>\" (or a Slack/Discord incoming-webhook URL). This gate fails every run until then (Tier 1E: fail loudly, never silently skip)."
            exit 1
          fi
          # Verify by presence/length only — NEVER print the secret value.
          echo "DEPLOY_ALERT_WEBHOOK is set (length ${#DEPLOY_ALERT_WEBHOOK}). Alert spine wired. ✓"
