name: Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: TypeScript + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acreos
          POSTGRES_PASSWORD: acreos
          POSTGRES_DB: acreos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acreos:acreos@localhost:5432/acreos_test
      SESSION_SECRET: test-session-secret-at-least-32-characters-long
      APP_URL: http://localhost:5000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Unified gate — the SAME `npm run check` the deploy gate (deploy.yml)
      # and CI (ci.yml) run. The previous bare `npx tsc --noEmit` ran WITHOUT
      # a heap ceiling and OOM-killed the runner (exit 134 = SIGABRT), so this
      # workflow was chronically red even when the code was green. `check`
      # pins NODE_OPTIONS=--max-old-space-size=6144 (under the runner's ~7GB),
      # forces `--incremental false`, and runs the schema + no-fabrication
      # ratchets — so Test can never disagree with the deploy gate.
      - name: TypeScript check + ratchets
        run: npm run check

      - name: Run database migrations
        run: npx drizzle-kit migrate
        continue-on-error: true # migrations may not exist in test env

      # Plain `vitest run` — identical to the deploy gate's blocking test step.
      # No `--coverage` here: coverage v8 instrumentation is heavier (OOM risk)
      # and its threshold gate is report-only, owned by ci.yml's Coverage step.
      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true
