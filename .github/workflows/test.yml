name: Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: TypeScript + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acreos
          POSTGRES_PASSWORD: acreos
          POSTGRES_DB: acreos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acreos:acreos@localhost:5432/acreos_test
      SESSION_SECRET: test-session-secret-at-least-32-characters-long
      APP_URL: http://localhost:5000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Unified gate — the SAME `npm run check` the deploy gate (deploy.yml)
      # and CI (ci.yml) run, so Test can never disagree with the deploy gate.
      # A bare `npx tsc --noEmit` here once ran with no heap ceiling and aborted
      # at exit 134 (SIGABRT), making this workflow chronically red on green
      # code. The ceiling now lives in scripts/lib/heap-ceiling.mjs and is passed
      # to each heavy child; it is NOT a workflow-level env, and NOT a shell
      # prefix in package.json (a `VAR=x cmd1 && cmd2` prefix binds to cmd1 only,
      # which is how the same 134 came back on main from 2026-08-17).
      - name: TypeScript check + ratchets
        run: npm run check

      # Build the schema from this repository and gate on the result. This
      # replaces `npx drizzle-kit migrate` + `continue-on-error: true`, which
      # could never have worked: drizzle.config.ts records that
      # migrations/meta/_journal.json was deleted on 2026-05-11, so the
      # migrator has no journal to read, and continue-on-error hid it.
      #
      # The script runs migrations/*.sql, then `node scripts/migrate.mjs` (the
      # literal Fly release_command), then its --dry-run, then the
      # declared-vs-built column mirror. ~20s from an empty database.
      #
      # The first execution of this path, 2026-09-04, found 37 columns declared
      # in shared/schema.ts that no DDL in the repo created — enough that
      # `db.select().from(properties)` failed on the database it built.
      - name: Build the schema from this repo and verify it
        run: npm run db:build-from-repo

      # Plain `vitest run` — identical to the deploy gate's blocking test step.
      # No `--coverage` here: coverage v8 instrumentation is heavier (OOM risk)
      # and its threshold gate is report-only, owned by ci.yml's Coverage step.
      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true
