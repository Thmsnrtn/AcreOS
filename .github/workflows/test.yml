name: Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# CI efficiency package (2026-11-11): a superseded head's run cancels itself
# instead of occupying the account's concurrent-job slots behind the new
# head. The group is keyed by ref (a PR's ref is stable across its pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change scope ──────────────────────────────────────────────────────────
  # Docs-only pull requests skip the heavy jobs below: a PR that touches
  # nothing but markdown / docs cannot change what the suites measure, and
  # the skipped checks report as SKIPPED (a by-design skip in settlement
  # counting), never as absent. Only pull_request events can be docs-only —
  # pushes always run everything, and any doubt resolves to a FULL run.
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change set
        id: scope
        run: |
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "event=${{ github.event_name }} — full run"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true)
          if [ -z "$files" ]; then
            echo "no diff available — full run"
            exit 0
          fi
          echo "changed files:"
          echo "$files"
          nondocs=$(echo "$files" | grep -vE '\.(md|mdx)$' | grep -vE '^docs/' || true)
          if [ -z "$nondocs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "docs-only change set — heavy jobs will skip"
          else
            echo "non-docs files present — full run"
          fi

  # ── TypeScript check + ratchets ───────────────────────────────────────────
  # Runs in parallel with the test shards below (CI efficiency package,
  # 2026-11-11); it used to serialize ahead of them inside the single job.
  typecheck:
    name: TypeScript check + ratchets
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Unified gate — the SAME `npm run check` the deploy gate (deploy.yml)
      # and CI (ci.yml) run, so Test can never disagree with the deploy gate.
      # A bare `npx tsc --noEmit` here once ran with no heap ceiling and aborted
      # at exit 134 (SIGABRT), making this workflow chronically red on green
      # code. The ceiling now lives in scripts/lib/heap-ceiling.mjs and is passed
      # to each heavy child; it is NOT a workflow-level env, and NOT a shell
      # prefix in package.json (a `VAR=x cmd1 && cmd2` prefix binds to cmd1 only,
      # which is how the same 134 came back on main from 2026-08-17).
      - name: TypeScript check + ratchets
        run: npm run check

  # ── Tests, sharded ────────────────────────────────────────────────────────
  # The full suite, partitioned by test file across three runners via
  # vitest's --shard (CI efficiency package, 2026-11-11; measured 32–45 min
  # as one serial job). The union of the three shards is the full suite;
  # nothing is dropped. Each shard job provisions its OWN pgvector service
  # and builds the schema in it, so the real-database suites get a private
  # database per shard — today every test file shares ONE database inside a
  # single job, in parallel forks, so a per-shard database removes
  # cross-file interference rather than adding any.
  test:
    name: TypeScript + Tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        # pgvector, not vanilla postgres:16. shared/schema.ts declares
        # solene_embedded_records with a `vector(1024)` column, so on an image
        # without the extension that CREATE TABLE fails and the schema this
        # repository builds is genuinely missing a table. Found on the first CI
        # run of the schema gate (2026-09-04): the gate was right, the image was
        # short. Same postgres 16, same POSTGRES_* env, plus the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acreos
          POSTGRES_PASSWORD: acreos
          POSTGRES_DB: acreos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acreos:acreos@localhost:5432/acreos_test
      # The tests that read Postgres itself (tests/helpers/realDb.ts) run against
      # the schema this job builds, and must not skip here.
      ACREOS_REAL_DATABASE_URL: postgresql://acreos:acreos@localhost:5432/acreos_test
      ACREOS_REQUIRE_REAL_DB: "1"
      SESSION_SECRET: test-session-secret-at-least-32-characters-long
      APP_URL: http://localhost:5000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build the schema from this repository and gate on the result. This
      # replaces `npx drizzle-kit migrate` + `continue-on-error: true`, which
      # could never have worked: drizzle.config.ts records that
      # migrations/meta/_journal.json was deleted on 2026-05-11, so the
      # migrator has no journal to read, and continue-on-error hid it.
      #
      # The script runs migrations/*.sql, then `node scripts/migrate.mjs` (the
      # literal Fly release_command), then its --dry-run, then the
      # declared-vs-built column mirror. ~20s from an empty database.
      #
      # The first execution of this path, 2026-09-04, found 37 columns declared
      # in shared/schema.ts that no DDL in the repo created — enough that
      # `db.select().from(properties)` failed on the database it built.
      # The round trip (sub-check 10/10) dumps and restores with the client
      # tools of the SERVER's major version (scripts/lib/pg-client-for-server.sh)
      # and refuses a mismatch. The runner image's own client tools are not
      # pinned and moved past the pg16 service on 2026-10-26 (pg_restore >= 17
      # sends SET transaction_timeout, which 16 rejects), so install 16's.
      - name: Install the PostgreSQL 16 client tools the service needs
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq --no-install-recommends postgresql-client-16; then
            # Not in this image's repositories: add the PostgreSQL project's
            # own apt repository (PGDG) and retry.
            sudo apt-get install -y -qq --no-install-recommends postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y -qq --no-install-recommends postgresql-client-16
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: Build the schema from this repo and verify it
        run: npm run db:build-from-repo

      # Plain `vitest run` — identical to the deploy gate's blocking test step.
      # No `--coverage` here: coverage v8 instrumentation is heavier (OOM risk)
      # and its threshold gate is report-only, owned by ci.yml's Coverage step.
      - name: Run tests
        run: npx vitest run --reporter=verbose --shard=${{ matrix.shard }}/3
        env:
          CI: true
