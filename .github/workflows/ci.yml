name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Type-check ────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unified gate — same `npm run check` the deploy gate runs, so CI and
      # deploy can never disagree on heap ceiling or which lints run.
      # `check` pins NODE_OPTIONS=--max-old-space-size=6144 (safely under the
      # ubuntu-latest runner's ~7GB; 8192 invited the OOM-killer that broke
      # deploys Jun 6-8), forces `--incremental false` (a stale tsBuildInfo in
      # node_modules produced a false-negative this session), and runs the
      # schema + no-fabrication ratchets.
      - name: TypeScript type check + ratchets
        run: npm run check

      # Blocking since 2026-07-07: `eslint client/src --max-warnings 0` passes
      # clean (the acreos/* ratchet baseline is all-zero), so a red here is a
      # real regression, not legacy noise.
      - name: ESLint
        run: npm run lint

      # Truth-engine audit — public-facing claims must each map to a
      # named source. A landing copy edit that doesn't update sources
      # (or cites a source that no longer contains the claim's tokens)
      # fails here, BEFORE the build ships to acreos.io. Same discipline
      # shape as migrate-mirror-check — guards a Soren-level invariant
      # at CI time instead of trusting Soren to remember.
      - name: Truth-engine audit (public claims)
        run: npm run truth-engine:audit

      # Same discipline applied to the programmatic SEO /learn/* pages.
      # Each content/learn/<vertical>/<state>.json must trace every
      # numeric, statutory, and capability claim to a named source
      # declared inside the same file. CI fails the push if any claim
      # token is unmatched.
      - name: Truth-engine audit (learn pages)
        run: npm run truth-engine:audit-learn

      # Sitemap freshness — client/public/sitemap.xml is generated from the
      # public-route source-of-truth (App.tsx static routes + content/learn/*
      # JSON). A new /learn or /compare page, or a retired public route, that
      # doesn't regenerate the sitemap fails here so crawlers never get a stale
      # map (the way /glossary lingered after it was archived). Fix locally with
      # `node scripts/generate-sitemap.mjs`.
      - name: Sitemap freshness check
        run: node scripts/generate-sitemap.mjs --check

      # Blocking test gate — the SAME `npx vitest run` the deploy gate
      # (deploy.yml) runs. This is the line that decides whether CI is green:
      # if the 6349-test suite passes, CI passes. Kept plain (no --coverage)
      # so CI and deploy can never disagree on the test signal.
      - name: Run tests (blocking — matches deploy gate)
        run: npx vitest run
        env:
          CI: true

      # Coverage is REPORT-ONLY. `vitest run --coverage` adds v8 instrumentation
      # over all of server/** + shared/**, which (a) is much heavier than the
      # plain run above (OOM risk — hence the 6144 heap, same ceiling as the
      # check gate) and (b) carries a `lines: 50` threshold in vitest.config.ts
      # that exits non-zero on a coverage DIP even when every test passes. That
      # threshold-on-the-blocking-path is exactly what trained the team to
      # ignore CI: a green codebase showed a red "CI". `continue-on-error`
      # keeps the coverage NUMBERS visible in the log without letting a
      # coverage dip (a non-correctness signal) fail the build. Re-promote to
      # blocking only by raising real coverage above the threshold first.
      - name: Coverage report (non-blocking)
        run: npm run test:coverage
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # This is the lint/typecheck job's build smoke-test, not the deploy
          # build — the deploy workflow owns sourcemap upload. Without this,
          # script/build.ts hard-fails on the missing SENTRY_AUTH_TOKEN and
          # CI can never go green (the failure the sitemap fix unmasked).
          SENTRY_SOURCEMAPS: skip

      # NOTE — no Playwright step here, deliberately. The desktop E2E suite
      # (`npm run test:e2e` → playwright.config.ts → tests/e2e/**) requires
      # (a) a provisioned Postgres (this job has no service container, so the
      # webServer `npm run start` exits 1 at boot — the exact chronic-red
      # failure this removal fixes) and (b) REAL Clerk credentials
      # (CLERK_SIGN_IN_TICKET or E2E_USER_EMAIL/PASSWORD — see
      # tests/e2e/auth*.setup.ts and playwright.mobile.config.ts's header:
      # "Separate from playwright.config.ts (which depends on real Clerk
      # credentials)"). Neither exists in CI, so the step could never pass —
      # it was a permanently-red non-gate. Unattended E2E coverage is owned
      # by e2e-mobile.yml + customer-surface-monitor.yml (test-auth bypass +
      # pgvector service, on every push/PR). The credentialed desktop suite
      # is driven via scripts/playwright-clerk-runner.sh.

  # NOTE — no CodeQL job here, deliberately. security.yml's `codeql` job runs
  # on the same triggers (push main / PR / weekly cron) with a SUPERSET of
  # queries (security-extended,security-and-quality) and uploads to the SAME
  # SARIF category ("/language:javascript-typescript"). The copy that lived
  # here was a duplicate of that analysis which, behind
  # `needs: lint-and-typecheck`, sat permanently skipped while CI was red —
  # duplicate compute when green, zero signal when red. Coverage owner:
  # .github/workflows/security.yml.

  # ── 6. Build & Container Image ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          # CI smoke build + container build only — deploy.yml owns the real
          # sourcemap upload (it gates/warns on SENTRY_AUTH_TOKEN itself).
          # Without this, script/build.ts hard-fails in CI on the missing
          # token the moment the lint job goes green and this job finally runs.
          SENTRY_SOURCEMAPS: skip

      - name: Verify build output
        run: |
          test -d dist || (echo "Build output missing" && exit 1)
          echo "Build succeeded"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: acreos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
