name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by deploy.yml as a pre-deploy gate (roadmap W10.1, readiness 0.3):
  # production ships only a SHA this workflow passed on.
  workflow_call:

# CI efficiency package (2026-11-11): a superseded head's run cancels itself
# instead of occupying the account's concurrent-job slots behind the new
# head. The group is keyed by ref (a PR's ref is stable across its pushes).
# workflow_call runs (the deploy gate) get a per-run group: a called gate
# must never be cancelled by, or cancel, an unrelated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Change scope ───────────────────────────────────────────────────────
  # Docs-only pull requests skip the heavy jobs below: a PR that touches
  # nothing but markdown / docs cannot change what the suites measure, and
  # the skipped checks report as SKIPPED (a by-design skip in settlement
  # counting), never as absent. Only pull_request events can be docs-only —
  # pushes to main and the deploy gate's workflow_call always run
  # everything, and any doubt (no diff, odd event) resolves to a FULL run.
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change set
        id: scope
        run: |
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "event=${{ github.event_name }} — full run"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true)
          if [ -z "$files" ]; then
            echo "no diff available — full run"
            exit 0
          fi
          echo "changed files:"
          echo "$files"
          nondocs=$(echo "$files" | grep -vE '\.(md|mdx)$' | grep -vE '^docs/' || true)
          if [ -z "$nondocs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "docs-only change set — heavy jobs will skip"
          else
            echo "non-docs files present — full run"
          fi

  # ── 1. Lint & Type-check ────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE — no `npm run check` step here, deliberately. The typecheck +
      # ratchets family is owned by test.yml's `typecheck` job ("TypeScript
      # check + ratchets"), which runs the identical command on every
      # pull_request / push-to-main head AND on claude/** branch pushes where
      # this workflow never fires (the discharge path for API-published heads).
      # The deploy path still gates on the same command via deploy.yml's own
      # pre-deploy `test` job. Removed 2026-11-15 (CI dedup) so the family
      # runs once per head, not twice.

      # Blocking since 2026-07-07: `eslint client/src --max-warnings 0` passes
      # clean (the acreos/* ratchet baseline is all-zero), so a red here is a
      # real regression, not legacy noise.
      - name: ESLint
        run: npm run lint

      # Truth-engine audit — public-facing claims must each map to a
      # named source. A landing copy edit that doesn't update sources
      # (or cites a source that no longer contains the claim's tokens)
      # fails here, BEFORE the build ships to acreos.io. Same discipline
      # shape as migrate-mirror-check — guards a Soren-level invariant
      # at CI time instead of trusting Soren to remember.
      - name: Truth-engine audit (public claims)
        run: npm run truth-engine:audit

      # Same discipline applied to the programmatic SEO /learn/* pages.
      # Each content/learn/<vertical>/<state>.json must trace every
      # numeric, statutory, and capability claim to a named source
      # declared inside the same file. CI fails the push if any claim
      # token is unmatched.
      - name: Truth-engine audit (learn pages)
        run: npm run truth-engine:audit-learn

      # Sitemap freshness — client/public/sitemap.xml is generated from the
      # public-route source-of-truth (App.tsx static routes + content/learn/*
      # JSON). A new /learn or /compare page, or a retired public route, that
      # doesn't regenerate the sitemap fails here so crawlers never get a stale
      # map (the way /glossary lingered after it was archived). Fix locally with
      # `node scripts/generate-sitemap.mjs`.
      - name: Sitemap freshness check
        run: node scripts/generate-sitemap.mjs --check

      # The two test executions that used to run serially at the end of this
      # job — the plain blocking suite and the coverage ratchet — moved out
      # (CI efficiency package, 2026-11-11): the coverage ratchet is the
      # parallel `coverage` job below, and the blocking suite is owned by
      # test.yml's `test` job. Measured 2026-11-11, this job ran 60–84 min
      # with those two steps as ~45–70 of it; the gates themselves are
      # unchanged, only their placement: same commands, same env, same
      # thresholds.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # This is the lint/typecheck job's build smoke-test, not the deploy
          # build — the deploy workflow owns sourcemap upload. Without this,
          # script/build.ts hard-fails on the missing SENTRY_AUTH_TOKEN and
          # CI can never go green (the failure the sitemap fix unmasked).
          SENTRY_SOURCEMAPS: skip

      # NOTE — no Playwright step here, deliberately. The desktop E2E suite
      # (`npm run test:e2e` → playwright.config.ts → tests/e2e/**) requires
      # (a) a provisioned Postgres (this job has no service container, so the
      # webServer `npm run start` exits 1 at boot — the exact chronic-red
      # failure this removal fixes) and (b) REAL Clerk credentials
      # (CLERK_SIGN_IN_TICKET or E2E_USER_EMAIL/PASSWORD — see
      # tests/e2e/auth*.setup.ts and playwright.mobile.config.ts's header:
      # "Separate from playwright.config.ts (which depends on real Clerk
      # credentials)"). Neither exists in CI, so the step could never pass —
      # it was a permanently-red non-gate. Unattended E2E coverage is owned
      # by e2e-mobile.yml + customer-surface-monitor.yml (test-auth bypass +
      # pgvector service, on every push/PR). The credentialed desktop suite
      # is driven via scripts/playwright-clerk-runner.sh.

  # NOTE — no CodeQL job here, deliberately. security.yml's `codeql` job runs
  # on the same triggers (push main / PR / weekly cron) with a SUPERSET of
  # queries (security-extended,security-and-quality) and uploads to the SAME
  # SARIF category ("/language:javascript-typescript"). The copy that lived
  # here was a duplicate of that analysis which, behind
  # `needs: lint-and-typecheck`, sat permanently skipped while CI was red —
  # duplicate compute when green, zero signal when red. Coverage owner:
  # .github/workflows/security.yml.

  # NOTE — no blocking-test-suite job here, deliberately. The blocking test
  # suite is owned by test.yml's `test` job, which runs the SAME suite with
  # the SAME 3-way shard partition plus a provisioned pgvector database and
  # the schema-build gate, so the real-database suites execute there instead
  # of skipping here. Every test that could fail in the removed no-DB run can
  # fail in test.yml's run. The duplicate was removed in the CI dedup
  # (2026-11-15) to stop paying for the suite twice per head.

  # ── 3. Coverage ratchet ───────────────────────────────────────────────────
  # Coverage is a BLOCKING RATCHET (2026-07-07). The old `lines: 50`
  # threshold was aspirational (measured global coverage: 18.22%) so this
  # step was permanently red behind continue-on-error — zero signal. The
  # thresholds in vitest.config.ts now sit just UNDER measured coverage:
  # a global floor plus per-file floors on the money/send/compliance
  # paths (creditPool, webhookHandlers, dunning, smsService,
  # directMailService, publicParcelReport). Green today; a red here means
  # a change dropped coverage on code that moves money or sends messages.
  # Raise floors as real coverage rises — never lower them.
  #
  # The ratchet still runs WHOLE over the full suite (it is a global
  # measurement — sharding it would change what it measures). It moved to
  # its own job so it runs in parallel with, not behind, the lint job.
  coverage:
    name: Coverage ratchet (blocking)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage ratchet (blocking)
        run: npm run test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: true

  # ── 6. Build & Container Image ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck, coverage]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          # CI smoke build + container build only — deploy.yml owns the real
          # sourcemap upload (it gates/warns on SENTRY_AUTH_TOKEN itself).
          # Without this, script/build.ts hard-fails in CI on the missing
          # token the moment the lint job goes green and this job finally runs.
          SENTRY_SOURCEMAPS: skip

      - name: Verify build output
        run: |
          test -d dist || (echo "Build output missing" && exit 1)
          echo "Build succeeded"

      # Bundle budget (roadmap W10.1). Down-only ceilings in
      # scripts/bundle-budget.json: growth past one fails, a loose one fails
      # until lowered. CI=true makes a missing bundle a failure, never a skip.
      - name: Bundle-size budget
        run: node scripts/check-bundle-size.js

      # Map code loads only on routes that render a map. Reads the chunk graph
      # the build wrote (dist/client-chunk-graph.json): the entry and the
      # map-free door landings carry no MapLibre/Mapbox module in their static
      # closure, and no module loaded on every page import()s one.
      - name: Route closure (map code only on map routes)
        run: node scripts/check-route-closure.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: acreos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
