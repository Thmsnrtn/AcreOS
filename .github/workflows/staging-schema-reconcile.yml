# Staging schema reconciliation — after EVERY staging deploy, and nightly.
#
# WHY THIS EXISTS: staging deploys apply NO schema. fly.staging.toml sets
# release_command = "true", so a deploy never runs scripts/migrate.mjs, no
# workflow, Dockerfile step or release command runs `db:push` against
# staging, and migrations/*.sql are never executed there. This workflow is
# the only path by which schema reaches staging's database. On 2026-10-20
# drift (missing leads.outreach_language*/timezone and four organizations
# columns) made every getLead() throw and 500'd the borrower-cookie audit;
# the repair applied migrate.mjs's DDL subset by hand, and this workflow
# automated it nightly (founder approved option A, 2026-10-20). On
# 2026-10-28 note_events (0293) still never landed: the nightly run was 77
# minutes before the merge and the deploy went green regardless. So staging.yml
# now CALLS this workflow (workflow_call) after every successful deploy, and
# the census job below proves the result.
#
# HOW: exec into a running staging machine via the Fly Machines API (the
# machine already holds DATABASE_URL and the deployed code) and run
# `node scripts/migrate.mjs --ddl-only` detached, then poll for its exit
# code. --ddl-only applies schema statements only (CREATE/ALTER/DROP/DO) —
# no seed/data statements ever run against staging from here.
#
# LOUD ON FAILURE, BY DESIGN: a non-zero migrate exit (any non-benign
# statement failure) fails this workflow. There is deliberately no
# dormancy guard — if FLY_API_TOKEN is missing this goes red, not quiet.
#
# CENSUS: after the reconcile, the census job reads staging's physical tables
# (SELECT-only, on a staging machine) and compares them against the
# declaration census (scripts/staging-schema-census.ts states the method and
# the tolerance). A mismatch beyond tolerance fails this workflow, itemized.
#
# STAGING ONLY. Production's release_command is untouched and never runs
# with --ddl-only.

name: Staging Schema Reconcile

on:
  schedule:
    # 07:17 UTC nightly — ~2-3am US Eastern, clear of the audit windows.
    - cron: "17 7 * * *"
  workflow_dispatch:
  # Called by staging.yml after every successful staging deploy, so the
  # deploy's own run goes red if the reconcile or the census fails.
  workflow_call:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile staging schema (migrate.mjs --ddl-only)
    runs-on: ubuntu-latest
    # Job-level, not workflow-level, so the group holds whether this runs
    # nightly, by dispatch, or called from staging.yml: two reconciles never
    # run against staging at once.
    concurrency:
      group: staging-schema-reconcile
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      # REMOTE_EXEC: the `node scripts/migrate.mjs --ddl-only` command in this
      # job is exec'd into a running staging machine via the Machines API — it
      # never runs on the GitHub runner, so the runner installs nothing and the
      # workflowScriptsHaveTheirDeps gate exempts jobs carrying this marker.
      # `pg` must instead resolve inside the deployed image: verified 2026-10-20
      # against staging machine 2863744f11e5d8 — /app/scripts/migrate.mjs present
      # and import("pg") resolves from /app.
      REMOTE_EXEC: "true"
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STAGING_APP: ${{ vars.FLY_STAGING_APP || 'acreos-staging' }}
    steps:
      - name: Run DDL-only migrate on a staging machine and await its verdict
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.request, urllib.error

          APP = os.environ.get("STAGING_APP") or "acreos-staging"
          TOKEN = os.environ.get("FLY_API_TOKEN") or ""
          if not TOKEN:
              print("::error::FLY_API_TOKEN secret is not set — refusing to go quiet.")
              sys.exit(1)

          BASE = f"https://api.machines.dev/v1/apps/{APP}"

          def call(method, path, body=None, timeout=90):
              req = urllib.request.Request(BASE + path, method=method)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, data=data, timeout=timeout) as r:
                  return json.loads(r.read().decode() or "{}")

          def exec_cmd(mid, command, timeout=60):
              out = call("POST", f"/machines/{mid}/exec",
                         {"command": command, "timeout": timeout})
              return out.get("exit_code", -1), (out.get("stdout") or ""), (out.get("stderr") or "")

          machines = call("GET", "/machines")
          if not isinstance(machines, list) or not machines:
              print(f"::error::No machines found for app {APP}.")
              sys.exit(1)
          started = [m for m in machines if m.get("state") == "started"]
          if not started:
              mid = machines[0]["id"]
              print(f"No started machine; starting {mid} ...")
              call("POST", f"/machines/{mid}/start", {})
              for _ in range(24):
                  time.sleep(5)
                  m = call("GET", f"/machines/{mid}")
                  if m.get("state") == "started":
                      started = [m]
                      break
          if not started:
              print("::error::Could not get a started staging machine.")
              sys.exit(1)
          mid = started[0]["id"]
          print(f"Using staging machine {mid}")

          launch = (
              "cd /app && rm -f /tmp/schema-reconcile.exit; "
              "(node scripts/migrate.mjs --ddl-only > /tmp/schema-reconcile.log 2>&1; "
              "echo $? > /tmp/schema-reconcile.exit) & echo launched"
          )
          rc, out, err = exec_cmd(mid, ["sh", "-c", launch])
          if rc != 0:
              print(f"::error::Failed to launch reconcile (exit {rc}): {out} {err}")
              sys.exit(1)
          print("Reconcile launched; polling for completion (up to 30 min) ...")

          code = None
          deadline = time.time() + 30 * 60
          while time.time() < deadline:
              time.sleep(30)
              try:
                  rc, out, _ = exec_cmd(mid, ["cat", "/tmp/schema-reconcile.exit"])
              except Exception as e:
                  print(f"poll error (retrying): {e}")
                  continue
              out = out.strip()
              if rc == 0 and out.lstrip("-").isdigit():
                  code = int(out)
                  break

          if code is None:
              print("::error::Reconcile did not finish within 30 minutes.")
              try:
                  _, tail, _ = exec_cmd(mid, ["tail", "-n", "40", "/tmp/schema-reconcile.log"])
                  print(tail)
              except Exception:
                  pass
              sys.exit(1)

          _, counts, _ = exec_cmd(mid, ["sh", "-c",
              "grep -c '\\[migrate\\] OK' /tmp/schema-reconcile.log; "
              "grep -c 'SKIPPED' /tmp/schema-reconcile.log; "
              "grep -c '\\[migrate\\] FAILED' /tmp/schema-reconcile.log"])
          _, tail, _ = exec_cmd(mid, ["tail", "-n", "40", "/tmp/schema-reconcile.log"])
          print("── reconcile log tail ──")
          print(tail)
          print(f"── migrate exit code: {code}; OK/SKIPPED/FAILED counts: {counts.strip()!r}")
          if code != 0:
              print("::error::Staging schema reconcile FAILED — migrate.mjs --ddl-only exited "
                    f"{code}. See the log tail above; the failing statement is in the full "
                    "log at /tmp/schema-reconcile.log on the staging machine.")
              sys.exit(1)
          print("Staging schema reconcile OK.")
          PYEOF

  census:
    name: Census — staging tables vs declarations
    needs: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STAGING_APP: ${{ vars.FLY_STAGING_APP || 'acreos-staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # SELECT-only. The query runs on a staging machine (which holds
      # DATABASE_URL); only table names and per-table constraint/trigger
      # counts come back — never rows. The runner never sees the database URL.
      - name: Read staging's physical tables (SELECT-only)
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.request

          APP = os.environ.get("STAGING_APP") or "acreos-staging"
          TOKEN = os.environ.get("FLY_API_TOKEN") or ""
          if not TOKEN:
              print("::error::FLY_API_TOKEN secret is not set — refusing to go quiet.")
              sys.exit(1)
          BASE = f"https://api.machines.dev/v1/apps/{APP}"

          def call(method, path, body=None, timeout=90):
              req = urllib.request.Request(BASE + path, method=method)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, data=data, timeout=timeout) as r:
                  return json.loads(r.read().decode() or "{}")

          machines = call("GET", "/machines")
          started = [m for m in machines if isinstance(machines, list) and m.get("state") == "started"]
          if not started:
              print(f"::error::No started staging machine for {APP} to read the census from.")
              sys.exit(1)
          mid = started[0]["id"]
          print(f"Reading physical tables via staging machine {mid}")

          sql = (
              "SELECT c.relname AS t, "
              "(SELECT count(*) FROM pg_constraint k WHERE k.conrelid = c.oid)::int AS k, "
              "(SELECT count(*) FROM pg_trigger g WHERE g.tgrelid = c.oid AND NOT g.tgisinternal)::int AS g "
              "FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace "
              "WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND NOT c.relispartition ORDER BY 1"
          )
          js = (
              "const {Client}=require('/app/node_modules/pg');"
              "const c=new Client({connectionString:process.env.DATABASE_URL});"
              "c.connect().then(()=>c.query(" + json.dumps(sql) + "))"
              ".then(r=>{const o=['COUNT '+r.rows.length];"
              "for(const x of r.rows)o.push('T '+x.t+' '+x.k+' '+x.g);"
              "process.stdout.write(o.join('\\n')+'\\n');return c.end()})"
              ".catch(e=>{console.error(e.message);process.exit(1)})"
          )
          out = call("POST", f"/machines/{mid}/exec", {"command": ["node", "-e", js], "timeout": 60})
          rc = out.get("exit_code", -1)
          if rc != 0:
              print(f"::error::Physical-table read failed on staging (exit {rc}): {out.get('stderr') or ''}")
              sys.exit(1)
          with open("staging-physical-tables.txt", "w") as f:
              f.write(out.get("stdout") or "")
          print((out.get("stdout") or "").splitlines()[0:1])
          PYEOF

      - name: Compare against the declaration census (fails loudly, itemized)
        run: npx tsx scripts/staging-schema-census.ts --physical staging-physical-tables.txt
