name: Borrower Cookie-Session E2E

# BEATRICE — Phase D3 end-to-end verification of the F3.4 fix
# (commit 99be388b + type-fix f4f46032). Confirms the cookie-session
# auth replacement for the borrower-statement surface is intact:
#
#   POST /api/borrower/auth/exchange   { accessToken, email }
#     → 204 + `borrower_stmt_session` cookie (HMAC-signed, IP-bound, 30 min)
#   GET  /api/borrower/statements/generate (cookie-only; 401 otherwise)
#
# Not a high-frequency surface; daily cron is plenty. On red, opens a
# GitHub issue tagged `borrower-flow-broken` (collapsed-comment dedupe
# pattern from customer-journey-audit.yml).
#
# Required secrets:
#   TARGET_URL         — production base URL (e.g. https://acreos.io)
#   E2E_DATABASE_URL   — throwaway test Postgres reachable from CI for the
#                        seeder; MUST NOT be the production DB. The seeder
#                        refuses prod-looking hosts unless explicitly forced.
#   BORROWER_SESSION_SECRET — the server-side signing secret in use at
#                        TARGET_URL. (Used only by `npm run check` /
#                        unit-tests — never echoed.)

on:
  schedule:
    # Daily at 06:17 UTC. Off-the-hour to dodge GHA top-of-hour queue
    # contention; offset from the other phase-D audits (customer-journey
    # :41, customer-surface-monitor :23) so they don't share a runner pool.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override TARGET_URL (defaults to the secret)"
        required: false
        type: string

# Both of this workflow's github-script steps write issues, and neither had
# ever actually run — every scheduled run stopped at the TARGET_URL guard —
# so nothing here has been exercised against the repository's DEFAULT token
# permissions. Declaring them makes the grant explicit instead of inherited,
# which is the difference between the notice reaching a person and a 403 that
# reads as one more failed audit.
permissions:
  contents: read
  issues: write # the borrower-flow RED issue and the unconfigured-audit notice

jobs:
  borrower-cookie-e2e:
    name: F3.4 borrower cookie-session — end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # CI-local throwaway Postgres for the seeder. We deliberately do NOT
      # seed into production — the seeder writes a fixture borrower whose
      # `(accessToken, email)` is then used to drive the live target URL.
      # That means TARGET_URL's data layer must also see this fixture. In
      # practice CI sets E2E_DATABASE_URL to a staging/ephemeral DB that
      # TARGET_URL also reads from; if no such DB exists, this workflow
      # must be wired to a staging environment, NOT prod.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acreos_e2e_borrower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TARGET_URL: ${{ github.event.inputs.target_url || secrets.TARGET_URL }}
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/acreos_e2e_borrower' }}
      # The signing secret must match TARGET_URL's. Same-domain run is
      # what unit tests use; never echoed.
      BORROWER_SESSION_SECRET: ${{ secrets.BORROWER_SESSION_SECRET }}
      CI: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # RED here used to mean two different things. `exit 1` on an unset
      # TARGET_URL produced the same failure as a broken borrower flow, and
      # after 94 consecutive reds that all meant "unconfigured" (measured
      # 2026-09-05 — every run failed at this step, so the seeder, the unit
      # tests and the E2E all showed as SKIPPED and "Open issue on RED" never
      # fired once), the alarm this workflow exists to raise had no volume
      # left. Unconfigured is now its own announced state; red is reserved for
      # the borrower flow actually breaking.
      - name: Resolve TARGET_URL (announce cleanly if unset)
        id: guard
        run: |
          if [ -z "${TARGET_URL:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Auditing $TARGET_URL"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Announce that this audit did not run
        if: steps.guard.outputs.skip == 'true'
        uses: ./.github/actions/audit-unconfigured
        with:
          audit: "borrower cookie-session E2E"
          missing: "TARGET_URL"
          what-it-covers: "the borrower statement flow end to end — cookie mint, cookie verify, and 401 without one"

      - name: Seed test-borrower fixture (on staging machine)
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The fixture MUST land in the staging DB, which is reachable only
          # from inside the Fly network (acreos-staging-pgv.flycast does not
          # resolve from GitHub runners). So the seeder runs ON a staging
          # machine via `fly machine exec` — no app code changes, no new
          # endpoints, no security-boundary changes. The machine already has
          # DATABASE_URL and node_modules (pg) in /app.
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          APP="${{ vars.FLY_STAGING_APP || 'acreos-staging' }}"
          MACHINE_ID=$(fly machine list --app "$APP" --json | jq -r '[.[] | select(.state=="started")][0].id')
          if [ -z "$MACHINE_ID" ] || [ "$MACHINE_ID" = "null" ]; then
            echo "::error::no started machine found on $APP"; exit 1
          fi
          echo "Seeding fixture on machine $MACHINE_ID ($APP)"
          SEED_B64=$(base64 -w0 scripts/seed-test-borrower.mjs)
          fly machine exec "$MACHINE_ID" --app "$APP" \
            "sh -c 'echo $SEED_B64 | base64 -d > /app/seed-borrower.mjs && cd /app && node seed-borrower.mjs seed'"
          fly machine exec "$MACHINE_ID" --app "$APP" \
            "cat /app/.test-borrower-credentials.json" > .test-borrower-credentials.json
          if [ ! -s .test-borrower-credentials.json ]; then
            echo "::error::seeder did not produce .test-borrower-credentials.json"
            exit 1
          fi
          echo "Fixture seeded; credentials retrieved."

      - name: Unit tests — statementAccess service
        if: steps.guard.outputs.skip != 'true'
        run: npx vitest run server/services/borrower/statementAccess.test.ts

      - name: Borrower cookie-session E2E
        id: e2e
        if: steps.guard.outputs.skip != 'true'
        run: |
          npx playwright test \
            --config=tests/e2e-borrower/playwright.config.ts
        continue-on-error: true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: borrower-cookie-e2e-report
          path: |
            tests/e2e-borrower/results/
            playwright-report/
            test-results/e2e-borrower/
          retention-days: 14


      # Verdict gate — a green checkmark must mean tests actually ran.
      # If the Playwright report is missing or shows zero executed tests,
      # fail loudly. A silent zero-test "pass" is worse than a red.
      - name: Verdict gate — refuse green on zero tests
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const p = 'tests/e2e-borrower/results/playwright-report.json';
            if (!fs.existsSync(p)) {
              console.error('::error::verdict gate: no playwright report at ' + p + ' — audit produced no evidence');
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(p, 'utf8')).stats || {};
            const ran = (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0);
            console.log('verdict: tests_ran=' + ran + ' (expected=' + s.expected + ' unexpected=' + s.unexpected + ' flaky=' + s.flaky + ' skipped=' + s.skipped + ')');
            if (ran === 0) {
              console.error('::error::verdict gate: zero tests executed — this is not a pass');
              process.exit(1);
            }
          "

      - name: Open issue on RED
        if: steps.e2e.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `borrower-flow RED on ${process.env.TARGET_URL} @ ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `The F3.4 borrower-cookie-session E2E is RED.`,
              ``,
              `**Target:** ${process.env.TARGET_URL}`,
              `**Trigger:** ${context.eventName}`,
              `**Run:** ${runUrl}`,
              ``,
              `Probable surfaces:`,
              `- POST /api/borrower/auth/exchange (cookie mint)`,
              `- GET /api/borrower/statements/generate (cookie verify)`,
              `- server/services/borrower/statementAccess.ts`,
              ``,
              `See workflow artifacts (\`borrower-cookie-e2e-report\`) for ` +
              `the Playwright HTML report + per-case JSON.`,
              ``,
              `Auto-opened by .github/workflows/borrower-cookie-e2e.yml.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "borrower-flow-broken",
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.data[0].number,
                body: `Another RED run: ${runUrl} (trigger=${context.eventName})`,
              });
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["borrower-flow-broken", "urgent"],
            });

      - name: Re-emit E2E exit code
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "::error::borrower cookie-session E2E exited RED — see issue + artifacts"
          exit 1
