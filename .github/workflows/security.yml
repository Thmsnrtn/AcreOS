name: Security Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run full security scan weekly (Sunday 00:00 UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:
  # Callable so deploy.yml can gate on it (roadmap W10.1b, readiness 0.3) once
  # it is green on main — see the note on deploy.yml's `ci` job.
  workflow_call:

jobs:
  # ── 1. npm audit — dependency vulnerability check ──────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on critical/high, report moderate)
        # The gate prints every critical/high finding with its advisory and
        # dev/PROD scope, and honours only the assessed, expiring, dev-only
        # exceptions in security/npm-audit-accepted.json. Logic and its tests:
        # scripts/npm-audit-gate.mjs, tests/unit/npmAuditGate.test.ts.
        run: |
          npm audit --json > npm-audit-report.json || true
          node scripts/npm-audit-gate.mjs npm-audit-report.json security/npm-audit-accepted.json package-lock.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  # ── 2. CodeQL SAST ─────────────────────────────────────────────────────────
  codeql:
    name: SAST — CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: true

      # The findings go to the code-scanning UI, which integration tokens
      # cannot read ("403 Resource not accessible by integration") — so a red
      # "CodeQL" PR check named "12 critical" with nothing anyone could open.
      # A finding you cannot read is one you can neither fix nor assess
      # (tests/unit/aGatingScanCanBeRead.test.ts makes the same rule for the
      # Trivy gates). This prints the SARIF into the job log: counts by
      # severity, then every critical and high result with rule and location.
      - name: Print CodeQL findings (non-gating, for the job log)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, collections
          def band(score):
              if score is None: return "none"
              s = float(score)
              return "critical" if s >= 9 else "high" if s >= 7 else "medium" if s >= 4 else "low"
          rows, counts = [], collections.Counter()
          for path in glob.glob("codeql-results/*.sarif"):
              for run in json.load(open(path)).get("runs", []):
                  sev = {}
                  tool = run.get("tool", {})
                  for comp in [tool.get("driver", {})] + tool.get("extensions", []):
                      for rule in comp.get("rules", []):
                          sev[rule.get("id")] = (rule.get("properties") or {}).get("security-severity")
                  for r in run.get("results", []):
                      b = band(sev.get(r.get("ruleId")))
                      counts[b] += 1
                      if b in ("critical", "high"):
                          loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                          where = f'{loc.get("artifactLocation", {}).get("uri", "?")}:{loc.get("region", {}).get("startLine", "?")}'
                          rows.append((b, r.get("ruleId"), where))
          print("CodeQL results by security severity:", dict(counts))
          for b, rule, where in sorted(rows):
              print(f"{b:9} {rule:45} {where}")
          PY

  # ── 3. Trivy — container image vulnerability scan ──────────────────────────
  trivy-image:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # IMPORTANT: this build is scan-only, so it must be FRESH. The previous
      # type=gha layer cache pinned months-old apt layers (vulnerable
      # openssl/chromium) into every "new" scan image — the scanner was
      # red-flagging packages a clean rebuild would already have patched.
      # no-cache + pull trades a few minutes of build time for a scan that
      # reflects what a real deploy build would actually ship today.
      - name: Build container image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: acreos:scan-${{ github.sha }}
          no-cache: true
          pull: true

      # OBSERVABILITY (2026-07-08): print the human-readable findings table
      # BEFORE the gating sarif step. The sarif path never prints what it
      # found, so every gate failure sent someone spelunking the code-scanning
      # UI to learn WHICH CVE tripped it (the gate has now fired twice in one
      # month on Go-toolchain CVEs alone). Non-gating: exit-code 0 here; the
      # sarif step below remains the enforcement.
      # PINNED 2026-08-31: @master broke overnight — upstream setup-trivy
      # added path-input validation its own default then failed ('path must
      # be a literal path'), taking the fs-scan AND container-scan jobs red
      # with zero repo changes. A moving branch is not a dependency; all
      # three usages pin the exact SHA the last GREEN run downloaded
      # (d2a0b607, from that run's own setup log — the repo's release tags
      # were not resolvable from this environment to pick one by name).
      - name: Print Trivy findings table (non-gating, for the job log)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # last-green master, 2026-08-31
        with:
          image-ref: "acreos:scan-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          skip-setup-trivy: false

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # last-green master, 2026-08-31
        with:
          image-ref: "acreos:scan-${{ github.sha }}"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          # Without this, trivy-action's sarif path DROPS the severity
          # filter ("Building SARIF report with all severities") and
          # exit-code:1 then fires on ANY finding — MEDIUMs and LOWs were
          # gating a job whose declared policy is CRITICAL,HIGH. This makes
          # the gate match the policy as written; the policy is unchanged.
          limit-severities-for-sarif: true

      - name: Upload Trivy image scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: "trivy-image-results.sarif"
          category: trivy-image

  # ── 4. Trivy — filesystem scan (secrets, misconfigurations) ───────────────
  trivy-fs:
    name: Trivy Filesystem & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      # OBSERVABILITY (2026-09-05): print the human-readable findings table
      # BEFORE the gating sarif step — the same step the container job got on
      # 2026-07-08, for the same reason, which was never mirrored here.
      #
      # The cost of that omission is measured: this job went red on run #1468
      # (2026-09-04) and stayed red for 37 consecutive runs, and NOBODY COULD
      # SAY WHY from the log, because the sarif path prints nothing about what
      # it found. Reading it required the code-scanning UI, which is closed to
      # integration tokens ("Resource not accessible by integration"). A gate
      # whose failure cannot be read is a gate that gets ignored — exactly the
      # state .trivyignore's header exists to prevent. Non-gating: exit-code 0
      # here; the sarif step below remains the enforcement.
      #
      # It is deliberately the SAME severity set and the SAME scanners as the
      # gating step. A table narrower than the gate would print "no findings"
      # on a red job and be worse than no table at all.
      - name: Print Trivy fs findings table (non-gating, for the job log)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # last-green master, 2026-08-31
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          scanners: "vuln,secret,misconfig"
          skip-setup-trivy: false

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # last-green master, 2026-08-31
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "1"
          scanners: "vuln,secret,misconfig"
          # Same sarif quirk as the image job above: without this the
          # severity filter is dropped for sarif output and exit-code:1
          # fires on ANY finding. Verified 2026-06-10 via the code-scanning
          # API: this job's only open findings are LOW (2× pk_test
          # stripe-publishable-token dummies in the E2E workflows + DS-0026
          # in oz/Dockerfile) — they were gating a job whose declared policy
          # is CRITICAL,HIGH,MEDIUM. The gate now matches the declared
          # policy; the policy is unchanged.
          limit-severities-for-sarif: true

      - name: Upload Trivy filesystem results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: trivy-filesystem

  # ── 5. Accessibility ────────────────────────────────────────────────────────
  # MOVED 2026-09-06 to the E2E Mobile workflow, which is where an audit can
  # actually run: it has the pgvector service, a real build and the seeded
  # test-auth session this job never had. The job that lived here was named
  # "Accessibility Audit" and had never audited accessibility — @axe-core was
  # not installed and its loader swallowed the missing dependency; no
  # storageState meant every page test early-returned on the /auth redirect;
  # the step ended in `|| true`; this job was absent from security-gate's
  # needs:; and with no build and no database `npm run start` could not boot.
  # See tests/e2e-mobile/accessibility-audit.spec.ts.
  #
  # Note: The full simulation suite (scripts/run-simulation.sh) should be run
  # manually before major releases — it requires Docker and takes longer than
  # CI allows.

  # ── 6. Summary gate ────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql, trivy-image, trivy-fs]
    if: always()

    steps:
      - name: Check all security jobs
        run: |
          NPM_RESULT="${{ needs.npm-audit.result }}"
          CODEQL_RESULT="${{ needs.codeql.result }}"
          TRIVY_IMAGE_RESULT="${{ needs.trivy-image.result }}"
          TRIVY_FS_RESULT="${{ needs.trivy-fs.result }}"

          echo "npm audit:    ${NPM_RESULT}"
          echo "CodeQL:       ${CODEQL_RESULT}"
          echo "Trivy image:  ${TRIVY_IMAGE_RESULT}"
          echo "Trivy fs:     ${TRIVY_FS_RESULT}"

          FAILED=0
          for RESULT in "$NPM_RESULT" "$CODEQL_RESULT" "$TRIVY_IMAGE_RESULT" "$TRIVY_FS_RESULT"; do
            if [ "$RESULT" = "failure" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more security scans found critical vulnerabilities. Review the Security tab and scan artifacts."
            exit 1
          fi

          echo "All security checks passed."
