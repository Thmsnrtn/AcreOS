# Builds and pushes the Fly CI runner image (ci-spike/runner/Dockerfile) to
# GHCR. The image is public on purpose: it contains only the public repo's
# toolchain plus the public CI test password already printed in test.yml —
# no secrets — and public visibility is what lets an ephemeral Fly Machine
# pull it without holding a registry credential (a runner's only credential
# is its single-use JIT config; see ci-spike/README.md).
#
# GitHub-hosted on purpose: building an image is not a deploy job, and the
# Fly rails (no deploy jobs/secrets on Fly runners) are untouched — this
# workflow never runs ON a Fly runner.
name: Fly Runner Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci-spike/runner/Dockerfile"
      - ".github/workflows/fly-runner-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: <redacted>

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ci-spike/runner
          push: true
          tags: |
            ghcr.io/thmsnrtn/acreos-ci-runner:latest
            ghcr.io/thmsnrtn/acreos-ci-runner:${{ github.sha }}
