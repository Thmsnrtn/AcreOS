name: Deploy to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false # Never cancel a production deploy mid-flight

jobs:
  test:
    name: TypeScript + Tests (pre-deploy gate)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://acreos:acreos@localhost:5432/acreos_test
      SESSION_SECRET: ci-session-secret-placeholder-32-chars-long
      APP_URL: http://localhost:5000
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acreos
          POSTGRES_PASSWORD: acreos
          POSTGRES_DB: acreos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Run tests
        run: npx vitest run
        env:
          CI: true
          SENTRY_SOURCEMAPS: skip

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (generates source maps)
        run: npm run build
        env:
          NODE_ENV: production
          # script/build.ts hard-fails in CI without a Sentry token. The
          # SENTRY_AUTH_TOKEN secret isn't currently set, so opt out
          # explicitly per the script's documented escape hatch. To
          # restore source-map uploads later: mint a Sentry token, set
          # gh secret SENTRY_AUTH_TOKEN, and remove this line.
          SENTRY_SOURCEMAPS: skip

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases new "$GITHUB_SHA"
          npx @sentry/cli releases files "$GITHUB_SHA" upload-sourcemaps ./dist \
            --url-prefix "~/" \
            --rewrite
          npx @sentry/cli releases finalize "$GITHUB_SHA"
          npx @sentry/cli releases deploys "$GITHUB_SHA" new -e production
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        continue-on-error: true  # Non-blocking: deploy proceeds even if Sentry upload fails

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check for pending migrations
        run: |
          # If new migration files exist, they will be applied by the release command
          MIGRATION_COUNT=$(find drizzle -name "*.sql" -newer fly.toml 2>/dev/null | wc -l)
          echo "New migrations since last deploy: $MIGRATION_COUNT"
          echo "MIGRATION_COUNT=$MIGRATION_COUNT" >> $GITHUB_ENV

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check post-deploy
        run: |
          # Wait for the boot + cache warmup window. Fly `min_machines_running = 0`
          # means the first request after a deploy cold-starts the machine; the
          # cached /api/health snapshot is refreshed every 30s by startPeriodicChecks,
          # so during the rollover we can curl an already-stale snapshot. /api/health/live
          # forces a fresh fan-out which is the right thing to check post-deploy.
          sleep 15
          curl --fail --retry 8 --retry-delay 10 --max-time 30 \
            "https://$(flyctl info --json | jq -r '.Hostname')/api/health/live" \
            || (echo "Health check failed after deploy" && exit 1)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # Fail the workflow when health check fails — the deploy itself has
        # already completed, but a 5xx on /api/health/live means the new release
        # is broken. Failing here triggers the "Record FAILED deployment"
        # ledger step and surfaces the bad release loudly.

      # Kareem §5: record this deploy in the deployments table so the
      # SOC 2 Type II auditor can tie every production change back to a
      # GIT_SHA + actor + workflow run. Auth is the DEPLOY_BOT_TOKEN
      # shared secret (gh secret set DEPLOY_BOT_TOKEN; fly secrets set
      # DEPLOY_BOT_TOKEN). Soft-failure: if the deploy ledger is
      # unreachable we still consider the deploy itself successful.
      - name: Record deployment in audit ledger
        if: success()
        run: |
          set -e
          HOST="$(flyctl info --json | jq -r '.Hostname')"
          PR_NUMBER=""
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            # Try to find the PR that introduced this commit on main.
            PR_NUMBER="$(gh pr list --search "${GITHUB_SHA}" --state merged --json number --jq '.[0].number // empty' || true)"
          fi
          APPROVED_BY=""
          if [ -n "$PR_NUMBER" ]; then
            APPROVED_BY="$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.state=="APPROVED") | .author.login] | join(",") // ""' || true)"
          fi
          BODY="$(jq -n \
            --arg gitSha "$GITHUB_SHA" \
            --arg deployedBy "$GITHUB_ACTOR" \
            --arg workflowRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg approvedBy "$APPROVED_BY" \
            --argjson prNumber "${PR_NUMBER:-null}" \
            '{gitSha:$gitSha, deployedBy:$deployedBy, workflowRunUrl:$workflowRunUrl, approvedBy:($approvedBy // null), prNumber:$prNumber, status:"success", environment:"production"}')"
          curl --fail --retry 3 --retry-delay 5 \
            -X POST "https://${HOST}/api/admin/deployments" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Bot-Token: ${{ secrets.DEPLOY_BOT_TOKEN }}" \
            -d "$BODY" \
            || echo "Deploy ledger POST failed — investigate but do not fail deploy"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Record FAILED deployment in audit ledger
        if: failure()
        run: |
          set -e
          HOST="acreos.app"
          BODY="$(jq -n \
            --arg gitSha "$GITHUB_SHA" \
            --arg deployedBy "$GITHUB_ACTOR" \
            --arg workflowRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{gitSha:$gitSha, deployedBy:$deployedBy, workflowRunUrl:$workflowRunUrl, status:"failure", environment:"production"}')"
          curl --fail --retry 1 \
            -X POST "https://${HOST}/api/admin/deployments" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Bot-Token: ${{ secrets.DEPLOY_BOT_TOKEN }}" \
            -d "$BODY" \
            || echo "Deploy ledger POST (failure path) failed — investigate"
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: echo "Deploy failed — check Fly.io dashboard for rollback options"
