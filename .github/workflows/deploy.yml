name: Deploy to Fly.io

on:
  push:
    branches: [main]
  # Manual re-kick (2026-07-07): a Fly release-command VM failed to start
  # ("deadline_exceeded: machine still starting" — transient platform
  # failure, run 28885355298) and there was NO way to re-run the deploy
  # short of pushing a new commit to main. workflow_dispatch gives the
  # founder a one-click retry from the Actions tab; the full pre-deploy
  # gate still runs.
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false # Never cancel a production deploy mid-flight

jobs:
  test:
    name: TypeScript + Tests (pre-deploy gate)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://acreos:acreos@localhost:5432/acreos_test
      SESSION_SECRET: ci-session-secret-placeholder-32-chars-long
      APP_URL: http://localhost:5000
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acreos
          POSTGRES_PASSWORD: acreos
          POSTGRES_DB: acreos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Same `npm run check` CI runs — the schema + no-fabrication ratchets, so
      # CI and deploy can never diverge on the gate.
      #
      # THE HEAP CEILING IS NOT SET HERE, and not by this workflow at all. Until
      # 2026-08-25 this comment claimed `check`'s NODE_OPTIONS prefix was a
      # "single source of truth for the heap ceiling". It was not: in POSIX sh
      # `VAR=x cmd1 && cmd2` binds VAR to cmd1 only, so the prefix reached the
      # first tsc and none of the other 26 commands. The heaviest one —
      # check:tests over tsconfig.tests.json, a SUPERSET of the protected
      # program — ran at Node's default ceiling and aborted with 134 on every
      # main run from 2026-08-17, skipping vitest and the build. The ceiling now
      # lives in scripts/lib/heap-ceiling.mjs and is PASSED to each heavy child.
      # Do not "restore" a job-level NODE_OPTIONS here: that would green CI while
      # leaving a bare `npm run check` on a laptop broken in the same way.
      - name: TypeScript check + ratchets
        run: npm run check

      - name: Run tests
        run: npx vitest run
        env:
          CI: true
          SENTRY_SOURCEMAPS: skip

      # Tier 1C: the client+server build must gate the deploy, not merely run
      # inside the deploy job after the gate already passed. A Rollup-only
      # resolution failure (e.g. a shared/ module importing a server-only
      # alias) type-checks clean and tests clean but breaks `npm run build` —
      # catch it HERE so the deploy job never starts.
      - name: Build (gate — client + server bundles)
        run: npm run build
        env:
          SENTRY_SOURCEMAPS: skip

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # Job-level so step `if:` conditions can see it through the env
      # context — a step's OWN env block is not visible to its `if:`, so the
      # old `if: env.SENTRY_AUTH_TOKEN != ''` on the upload step could never
      # fire even with the secret set.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # ONE definition of "the set of images this app's machines are running",
      # shared by the pre-deploy baseline and the post-deploy assessment. It
      # MUST be a single program: if the two steps computed the image set even
      # slightly differently they would disagree on every deploy and report a
      # promotion that never happened. Tolerates both flyctl JSON casings,
      # ignores destroyed machines and the ephemeral release_command machine.
      # Non-JSON input (an auth error, a flyctl schema change) makes jq exit
      # non-zero and yields an EMPTY set, which both consumers read as
      # "unknown" rather than as "nothing changed".
      FLY_IMAGE_SET_JQ: >-
        [ .[]
        | select((.state // .State // "") != "destroyed")
        | select((.config.metadata.fly_process_group // .Config.Metadata.fly_process_group // "") != "fly_app_release_command")
        | (.config.image // .Config.Image // empty) ]
        | sort | unique | join(",")

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Tier 1E: a missing SENTRY_AUTH_TOKEN is a visible WARNING annotation
      # on every production deploy — never a silent skip. 🔑 FOUNDER: mint a
      # Sentry auth token (Sentry → Settings → Auth Tokens, scope
      # project:releases), then `gh secret set SENTRY_AUTH_TOKEN`. The moment
      # the secret exists, source maps build + upload with no code change.
      - name: Build (generates source maps)
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning title=Sentry sourcemaps NOT uploaded::SENTRY_AUTH_TOKEN secret is unset — production stack traces stay minified. 🔑 Founder: mint a Sentry token, then run: gh secret set SENTRY_AUTH_TOKEN"
            export SENTRY_SOURCEMAPS=skip
          fi
          npm run build
        env:
          NODE_ENV: production

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli releases new "$GITHUB_SHA"
          npx @sentry/cli releases files "$GITHUB_SHA" upload-sourcemaps ./dist \
            --url-prefix "~/" \
            --rewrite
          npx @sentry/cli releases finalize "$GITHUB_SHA"
          npx @sentry/cli releases deploys "$GITHUB_SHA" new -e production
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        continue-on-error: true  # Non-blocking: deploy proceeds even if Sentry upload fails

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check for pending migrations
        run: |
          # If new migration files exist, they will be applied by the release command
          MIGRATION_COUNT=$(find drizzle -name "*.sql" -newer fly.toml 2>/dev/null | wc -l)
          echo "New migrations since last deploy: $MIGRATION_COUNT"
          echo "MIGRATION_COUNT=$MIGRATION_COUNT" >> $GITHUB_ENV

      # ── Pre-deploy baseline (2026-08-25, run 32902473209) ──────────────────
      # Record WHAT production is running BEFORE we touch it. Two consumers:
      #   1. "Assess production after deploy" compares the live machine image
      #      set against this to decide whether this run actually PROMOTED
      #      anything — the distinction the old rollback condition got wrong.
      #   2. The rollback re-promotes THIS EXACT image, which makes rolling
      #      back idempotent: re-running the job cannot walk production
      #      backwards one release per attempt.
      # Never fails the deploy. An unresolved baseline degrades to
      # promoted=unknown, which still permits a rollback when production is
      # confirmed down — the reverse default would recreate this outage.
      - name: Capture pre-deploy release baseline
        id: baseline
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          set +o pipefail
          IMAGES="$(flyctl machines list --json 2>/dev/null | jq -r "$FLY_IMAGE_SET_JQ" 2>/dev/null)"
          IMAGE="$(flyctl releases list --json 2>/dev/null | jq -r '[.[] | select(.Status == "complete")][0].ImageRef // empty' 2>/dev/null)"
          if [ -z "$IMAGE" ]; then
            # Fall back to the machines' own image, but ONLY when they all agree.
            # A pre-existing mixed set has no single correct rollback target.
            case "$IMAGES" in
              ""|*,*) IMAGE="" ;;
              *)      IMAGE="$IMAGES" ;;
            esac
          fi
          echo "Pre-deploy machine image set: ${IMAGES:-<unresolved>}"
          echo "Pre-deploy rollback target:   ${IMAGE:-<unresolved>}"
          if [ -z "$IMAGES" ]; then
            echo "::warning title=Pre-deploy baseline unresolved::flyctl returned no machine image set. Auto-rollback degrades to promoted=unknown and to flyctl's own release rollback."
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy to Fly.io
        id: fly_deploy
        # wait-timeout 600 (not 300): the Fly release_command machine (node
        # scripts/migrate.mjs) intermittently takes >5min just to change state
        # under provisioning pressure — a recurring "timeout reached waiting for
        # machine's state to change" abort even with MIGRATION_COUNT=0. Doubling
        # the headroom absorbs the flake; migrate.mjs itself is idempotent + fast.
        #
        # 2026-07-07: the 600s headroom was exceeded TWICE in one afternoon
        # (runs 28885355298, 28890427978) — the release VM sat in
        # created/starting for 10 minutes with Fly's status page showing no
        # incident, so more headroom alone doesn't absorb this class of flake.
        # Retry the whole deploy up to 3 attempts with backoff instead. Safe by
        # construction: a failed release command aborts BEFORE any machine
        # rolls, and migrate.mjs is idempotent; the remote builder caches, so
        # retries skip straight back to the release step.
        run: |
          set +e
          code=1
          for attempt in 1 2 3; do
            echo "── flyctl deploy attempt ${attempt}/3 ──"
            flyctl deploy --remote-only --wait-timeout 600 --build-arg GIT_SHA=${{ github.sha }}
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            echo "::warning::flyctl deploy attempt ${attempt}/3 failed (exit ${code})"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 120)); fi
          done
          exit "$code"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check post-deploy
        id: health
        run: |
          # Wait for the boot + cache warmup window. Fly `min_machines_running = 0`
          # means the first request after a deploy cold-starts the machine; the
          # cached /api/health snapshot is refreshed every 30s by startPeriodicChecks,
          # so during the rollover we can curl an already-stale snapshot. /api/health/live
          # forces a fresh fan-out which is the right thing to check post-deploy.
          #
          # Previously this used `flyctl info --json | jq -r '.Hostname'` to discover
          # the hostname. flyctl 0.4.56+ removed the --json flag from `info`, which
          # silently produced `https:///api/health/live` and exhausted the retry
          # budget on every deploy. Pin the production hostname instead — Cloudflare
          # is in front, so we're testing the full request path the customer hits.
          sleep 15
          curl --fail --retry 8 --retry-delay 10 --max-time 30 \
            "https://acreos.io/api/health/live" \
            || (echo "Health check failed after deploy" && exit 1)
        # Fail the workflow when health check fails — the deploy itself has
        # already completed, but a 5xx on /api/health/live means the new release
        # is broken. Failing here triggers the auto-rollback below, then the
        # "Record FAILED deployment" ledger step, and surfaces the bad release
        # loudly.

      # ── Migration evidence read-back (2026-08-29, OD-8 "approve with
      # evidence") ─────────────────────────────────────────────────────────
      # flyctl streams the release machine's LIFECYCLE into this job log but
      # not its STDOUT — so migrate.mjs's row-count evidence for conditional
      # drops (the [od8-*] NOTICE/WARNING lines, surfaced by the notice
      # listener on its pool) was landing only in Fly's short-retention log
      # buffer, which nothing read. The founder's ruling is that the deploy
      # watch READS the evidence; this step makes that true by dumping the
      # recent [migrate] lines here, minutes after the release command ran.
      # A populated survivor becomes a workflow warning annotation — visible
      # on the run page without opening the log. Never fails the deploy:
      # evidence is for reading, and a survivor is by design left in place.
      - name: Surface release-command migration evidence
        if: always() && steps.fly_deploy.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "── [migrate] lines from the release machine (recent log buffer) ──"
          LOGS="$(timeout 60 flyctl logs --no-tail 2>/dev/null | grep -F '[migrate]' || true)"
          if [ -z "$LOGS" ]; then
            echo "::warning title=Migration evidence not in buffer::flyctl logs returned no [migrate] lines — the buffer may have rotated. The evidence still printed on the release machine; check 'fly logs' promptly after the next deploy."
          else
            printf '%s\n' "$LOGS"
            printf '%s\n' "$LOGS" | grep -F 'LEFT IN PLACE' | while IFS= read -r line; do
              echo "::warning title=Populated table survived its conditional drop::${line}"
            done
          fi

      # ── Post-deploy assessment (2026-08-25, run 32902473209) ───────────────
      # WHY THIS STEP EXISTS. The rollback below used to be gated on
      #   failure() && fly_deploy.outcome == 'success' && health.outcome == 'failure'
      # on the stated premise "NOT on a failed deploy — Fly never promoted,
      # nothing to roll back". That premise is FALSE. flyctl rolls machines ONE
      # AT A TIME, so a rollout can promote several machines and THEN fail on a
      # later one. On 2026-08-25 exactly that happened, and the condition was
      # doubly false: fly_deploy.outcome was 'failure', AND — because the health
      # step carries no `if:`, so its implicit condition is success() — health
      # was SKIPPED, making its outcome 'skipped', never 'failure'. Fixing only
      # the first clause would still not have fired. Production sat
      # half-promoted and fully DOWN for hours.
      #
      # Step outcomes were the wrong evidence. This step gathers the right
      # evidence — the live state of production and of the machines — and
      # publishes it as two outputs the rollback gates on:
      #   healthy=true|false          does production ANSWER right now
      #                               (confirmation probes, not a step outcome)
      #   promoted=true|false|unknown did this run change the set of images the
      #                               app's machines are running
      #
      # It is an assessor, not a gate: it always exits 0. A spurious red here
      # would be indistinguishable from a real deploy failure in the ledger and
      # on the pager.
      - name: Assess production after deploy
        id: assess
        # Runs on every path where the deploy step actually EXECUTED and the
        # health step did not already pass:
        #   fly_deploy success + health failure  -> the old signature
        #   fly_deploy failure + health skipped  -> the 2026-08-25 signature
        # The two positive equality tests are deliberate. A step that never ran
        # at all (the build step above failed, say) has NO entry in the `steps`
        # context, so `outcome` renders as '' — a negative test such as
        # `!= 'skipped'` would be TRUE there and assess a deploy that never
        # happened. Only positive tests are safe on this context.
        if: >-
          always()
          && steps.health.outcome != 'success'
          && (steps.fly_deploy.outcome == 'success' || steps.fly_deploy.outcome == 'failure')
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Via env, never inlined into the script: a `${{ }}` expansion inside
          # shell quotes is a code-injection seam.
          BASE_IMAGES: ${{ steps.baseline.outputs.images }}
          DEPLOY_OUTCOME: ${{ steps.fly_deploy.outcome }}
        run: |
          set +e
          set +o pipefail
          echo "Deploy step outcome: ${DEPLOY_OUTCOME}. Probing production directly."

          # Guard 1 — is production ACTUALLY down? Three probes over ~40s, on
          # top of the health step's own 8x10s budget (or, on the failed-deploy
          # path, standing alone). One flaky probe cannot reach the rollback.
          HEALTHY=false
          for i in 1 2 3; do
            if curl --fail --silent --max-time 20 "https://acreos.io/api/health/live" > /dev/null; then
              HEALTHY=true
              echo "Confirmation probe ${i}: production is HEALTHY."
              break
            fi
            echo "Confirmation probe ${i}: production did NOT answer."
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done

          PROMOTED=unknown
          if [ "$HEALTHY" = "true" ]; then
            # Production answers, whatever the step outcomes said. Nothing to
            # recover — skip the Fly introspection so a healthy path stays fast.
            echo "Production is healthy — no rollback will be considered."
            {
              echo "healthy=true"
              echo "promoted=unknown"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard 2 — did this run promote anything? A build failure, an auth
          # failure or a failed release_command leaves the machine image set
          # byte-identical to the pre-deploy baseline.
          NOW_IMAGES="$(flyctl machines list --json 2>/dev/null | jq -r "$FLY_IMAGE_SET_JQ" 2>/dev/null)"
          echo "baseline image set: ${BASE_IMAGES:-<unresolved>}"
          echo "current  image set: ${NOW_IMAGES:-<unresolved>}"
          if [ -n "$BASE_IMAGES" ] && [ -n "$NOW_IMAGES" ]; then
            if [ "$NOW_IMAGES" = "$BASE_IMAGES" ]; then PROMOTED=false; else PROMOTED=true; fi
          fi

          if [ "$PROMOTED" = "false" ]; then
            echo "::warning title=Production is DOWN but this deploy promoted nothing::The machine image set is unchanged from before the deploy, so rolling back would re-promote the image that is ALREADY running. Not rolling back. This is an outage with a cause other than this release — check Fly.io status, the database, and upstream providers."
          fi
          if [ "$PROMOTED" = "unknown" ]; then
            # Deliberate asymmetry. Production is CONFIRMED down; the only
            # question is whether a rollback helps. Defaulting "unknown" to
            # false would reproduce 2026-08-25 (rollback structurally unable to
            # fire during a real outage); defaulting it to true costs, at worst,
            # one redundant re-promotion of the running image.
            echo "::warning title=Promotion state UNKNOWN::Could not compare machine images against the pre-deploy baseline. Treating the release as PROMOTED, because production is confirmed down and doing nothing is the worse failure."
          fi
          {
            echo "healthy=false"
            echo "promoted=$PROMOTED"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # Tier 1E — automated rollback. It now fires on a signature stated in
      # terms of OBSERVED PRODUCTION STATE rather than step outcomes:
      # "production is confirmed down AND this run promoted machines."
      # Guards, in order:
      #   1. failure()          — never fires on an otherwise-green run. Implied
      #      by the assess condition, kept as defence in depth.
      #   2. healthy == 'false' — three confirmation probes, plus a fourth
      #      immediately below before anything is touched. Covers BOTH the
      #      deploy-failed and the health-failed paths, because it reads
      #      production, not a step result.
      #   3. promoted != 'false' — a build/auth/release_command failure promotes
      #      nothing and is excluded. 'unknown' passes; see the assessor's note.
      #   4. The rollback target is the EXACT image captured before THIS run's
      #      deploy, not "one release back", so re-running the job re-promotes
      #      the same image. Idempotent — a human re-run cannot walk production
      #      backwards through release history.
      #   5. The rollback is not health-checked-then-redeployed, and the
      #      workflow runs once per push under concurrency: production-deploy.
      #      The run ends red, "Notify on failure" pages, and the next deploy is
      #      a deliberate human action. No rollback->deploy->rollback oscillation.
      # Step status is itself the report: GREEN = the rollback restored health,
      # RED = it did not (or could not run).
      - name: Auto-rollback on confirmed-unhealthy production
        if: >-
          failure()
          && steps.assess.outputs.healthy == 'false'
          && steps.assess.outputs.promoted != 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BASE_IMAGE: ${{ steps.baseline.outputs.image }}
          PROMOTED: ${{ steps.assess.outputs.promoted }}
          DEPLOY_OUTCOME: ${{ steps.fly_deploy.outcome }}
        run: |
          set +e
          set +o pipefail
          echo "Production confirmed unhealthy (deploy outcome=${DEPLOY_OUTCOME}, promoted=${PROMOTED}) — preparing rollback."
          # Never act on stale evidence: the assessor's probes finished seconds
          # ago, but this is the last moment before we touch a live release.
          if curl --fail --silent --max-time 20 "https://acreos.io/api/health/live" > /dev/null; then
            echo "Production recovered between assessment and rollback — NOT rolling back."
            exit 0
          fi

          ROLLED=0
          # 1. Deterministic and idempotent: re-promote the exact image
          #    production was running before this run started.
          if [ -n "$BASE_IMAGE" ]; then
            echo "Rolling back to the pre-deploy image: $BASE_IMAGE"
            flyctl deploy --image "$BASE_IMAGE" --wait-timeout 600 && ROLLED=1
          fi
          # 2. flyctl's own rollback, newer spelling then older.
          if [ "$ROLLED" -eq 0 ]; then
            echo "Falling back to: flyctl releases rollback"
            flyctl releases rollback --yes 2>/dev/null && ROLLED=1
            if [ "$ROLLED" -eq 0 ]; then
              flyctl releases rollback 2>/dev/null && ROLLED=1
            fi
          fi
          if [ "$ROLLED" -eq 0 ]; then
            echo "::error title=Auto-rollback FAILED::Could not re-promote the previous image and flyctl releases rollback did not succeed. Roll back manually in the Fly.io dashboard NOW."
            exit 1
          fi

          echo "Rollback submitted. Verifying production health..."
          sleep 15
          if curl --fail --retry 6 --retry-delay 10 --max-time 30 "https://acreos.io/api/health/live" > /dev/null; then
            echo "::warning title=Auto-rollback succeeded::Release ${GITHUB_SHA:0:7} was rolled back automatically and production is healthy again. main still points at the bad commit — fix forward or revert."
          else
            echo "::error title=Rollback did NOT restore health::Both the new release and the rollback are unhealthy — this is an infrastructure-level outage. Check Fly.io status + dashboard immediately."
            exit 1
          fi

      # Kareem §5: record this deploy in the deployments table so the
      # SOC 2 Type II auditor can tie every production change back to a
      # GIT_SHA + actor + workflow run. Auth is the DEPLOY_BOT_TOKEN
      # shared secret (gh secret set DEPLOY_BOT_TOKEN; fly secrets set
      # DEPLOY_BOT_TOKEN). Soft-failure: if the deploy ledger is
      # unreachable we still consider the deploy itself successful.
      - name: Record deployment in audit ledger
        if: success()
        run: |
          set -e
          # flyctl 0.4.56+ removed `info --json`, which silently produced an
          # empty hostname and broke this ledger POST. Pin the production host
          # (Cloudflare-fronted) — the same path the health check uses.
          HOST="acreos.io"
          PR_NUMBER=""
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            # Try to find the PR that introduced this commit on main.
            PR_NUMBER="$(gh pr list --search "${GITHUB_SHA}" --state merged --json number --jq '.[0].number // empty' || true)"
          fi
          APPROVED_BY=""
          if [ -n "$PR_NUMBER" ]; then
            APPROVED_BY="$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.state=="APPROVED") | .author.login] | join(",") // ""' || true)"
          fi
          BODY="$(jq -n \
            --arg gitSha "$GITHUB_SHA" \
            --arg deployedBy "$GITHUB_ACTOR" \
            --arg workflowRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg approvedBy "$APPROVED_BY" \
            --argjson prNumber "${PR_NUMBER:-null}" \
            '{gitSha:$gitSha, deployedBy:$deployedBy, workflowRunUrl:$workflowRunUrl, approvedBy:($approvedBy // null), prNumber:$prNumber, status:"success", environment:"production"}')"
          curl --fail --retry 3 --retry-delay 5 \
            -X POST "https://${HOST}/api/admin/deployments" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Bot-Token: ${{ secrets.DEPLOY_BOT_TOKEN }}" \
            -d "$BODY" \
            || echo "Deploy ledger POST failed — investigate but do not fail deploy"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Record FAILED deployment in audit ledger
        if: failure()
        run: |
          set -e
          # Pin the real production host. Was hardcoded to the wrong domain
          # (acreos.app), so the failure-path ledger POST never reached the API.
          HOST="acreos.io"
          BODY="$(jq -n \
            --arg gitSha "$GITHUB_SHA" \
            --arg deployedBy "$GITHUB_ACTOR" \
            --arg workflowRunUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{gitSha:$gitSha, deployedBy:$deployedBy, workflowRunUrl:$workflowRunUrl, status:"failure", environment:"production"}')"
          curl --fail --retry 1 \
            -X POST "https://${HOST}/api/admin/deployments" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Bot-Token: ${{ secrets.DEPLOY_BOT_TOKEN }}" \
            -d "$BODY" \
            || echo "Deploy ledger POST (failure path) failed — investigate"
        continue-on-error: true

      # Real out-of-band alert so a failed production deploy reaches Tom's
      # phone instead of dying in a CI log nobody is watching. Posts a short
      # message to the DEPLOY_ALERT_WEBHOOK secret (ntfy.sh topic URL or a
      # Slack/Discord incoming-webhook URL — both accept a POST body).
      #
      # Tier 1E (elevation blueprint): if the secret is UNSET this step FAILS
      # with an explicit error — it must never silently skip. An unwired alert
      # path is indistinguishable from a wired one until the night it matters.
      #
      # 🔑 FOUNDER ACTION — set the secret once:
      #   ntfy:  gh secret set DEPLOY_ALERT_WEBHOOK --body "https://ntfy.sh/<your-private-topic>"
      #   Slack: gh secret set DEPLOY_ALERT_WEBHOOK --body "https://hooks.slack.com/services/XXX/YYY/ZZZ"
      - name: Notify on failure
        if: failure()
        env:
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
        run: |
          MSG="🚨 AcreOS production deploy FAILED — ${GITHUB_SHA:0:7} by ${GITHUB_ACTOR}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — auto-rollback may have fired; verify in the Fly.io dashboard."
          if [ -z "$DEPLOY_ALERT_WEBHOOK" ]; then
            echo "$MSG"
            echo "::error title=DEPLOY_ALERT_WEBHOOK secret is NOT set::A production deploy just FAILED and no out-of-band alert was sent — this failure is only visible in CI. 🔑 Founder: gh secret set DEPLOY_ALERT_WEBHOOK --body \"https://ntfy.sh/<private-topic>\" (or a Slack/Discord incoming-webhook URL)."
            exit 1
          fi
          # ntfy renders the raw POST body as the message, so a JSON wrapper
          # shows up as literal {"text":...} on the phone. Send a PLAIN-TEXT
          # body to ntfy (clean message + native Title/Priority/Tags headers);
          # fall back to JSON for Slack/Discord webhooks. --fail surfaces a
          # 4xx/5xx in the log, but we never fail the workflow on a notify miss.
          if echo "$DEPLOY_ALERT_WEBHOOK" | grep -qi "ntfy"; then
            curl --fail --silent --show-error --max-time 15 \
              -H "Title: AcreOS deploy failed" \
              -H "Priority: urgent" \
              -H "Tags: rotating_light" \
              -d "$MSG" \
              "$DEPLOY_ALERT_WEBHOOK" \
              || echo "Alert webhook POST failed — investigate (deploy already marked failed)."
          else
            curl --fail --silent --show-error --max-time 15 \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$MSG" '{text:$t, message:$t, content:$t}')" \
              "$DEPLOY_ALERT_WEBHOOK" \
              || echo "Alert webhook POST failed — investigate (deploy already marked failed)."
          fi

      # Tier 1E — alert-spine configuration gate, evaluated on EVERY deploy
      # (success or failure). The blueprint's rule: workflows FAIL, not
      # silently skip, when DEPLOY_ALERT_WEBHOOK is unset. Placed LAST so a
      # missing secret never blocks the deploy itself and never miscounts as
      # a failed deployment in the audit-ledger steps above (their
      # `if: failure()` conditions evaluate before this step runs) — but the
      # run goes RED with an actionable error until the secret exists.
      - name: Alert spine configured (DEPLOY_ALERT_WEBHOOK)
        if: always()
        env:
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_ALERT_WEBHOOK" ]; then
            echo "::error title=DEPLOY_ALERT_WEBHOOK secret is NOT set::Deploy completed, but the out-of-band alert path is UNWIRED — a future failed deploy would die silently in CI logs. 🔑 Founder: gh secret set DEPLOY_ALERT_WEBHOOK --body \"https://ntfy.sh/<private-topic>\" (or a Slack/Discord incoming-webhook URL). This gate fails every deploy run until the secret exists (Tier 1E: fail loudly, never silently skip)."
            exit 1
          fi
          # Verify by presence/length only — NEVER print the secret value.
          echo "DEPLOY_ALERT_WEBHOOK is set (length ${#DEPLOY_ALERT_WEBHOOK}). Alert spine wired. ✓"

  # ── Gate-failure alarm (2026-07-03, stale-release incident) ────────────────
  # The deploy job's own failure-alert step never fires when the TEST gate
  # fails, because `needs: test` means deploy never starts. That is exactly
  # what happened on 2026-06-29: the pre-deploy tsc gate failed, no page went
  # out at CAUSE time, and the founder learned about it from eleven hourly
  # stale-release symptom pages instead of one failure page with the reason.
  # This job pages ONCE, immediately, when the gate refuses a main push.
  notify-gate-failure:
    name: Page founder on pre-deploy gate failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post gate-failure alert
        env:
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
        run: |
          MSG="🚨 AcreOS deploy BLOCKED at the pre-deploy gate for ${GITHUB_SHA:0:7} — main will NOT ship until this is fixed. https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "$MSG"
          if [ -z "$DEPLOY_ALERT_WEBHOOK" ]; then
            echo "::error title=DEPLOY_ALERT_WEBHOOK secret is NOT set::Gate failed and no alert could be sent."
            exit 1
          fi
          if echo "$DEPLOY_ALERT_WEBHOOK" | grep -qi "ntfy"; then
            curl --fail --silent --show-error --max-time 15 \
              -H "Title: AcreOS deploy gate FAILED" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -d "$MSG" \
              "$DEPLOY_ALERT_WEBHOOK" \
              || echo "Alert webhook POST failed — investigate."
          else
            curl --fail --silent --show-error --max-time 15 \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$MSG" '{text:$t, message:$t, content:$t}')" \
              "$DEPLOY_ALERT_WEBHOOK" \
              || echo "Alert webhook POST failed — investigate."
          fi
