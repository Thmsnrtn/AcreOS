# ============================================================================
# Fly recovery — manual one-shot, 2026-08-25/26 production outage. ROUND 2.
# ----------------------------------------------------------------------------
# ROUND 1 (run 32912493840) established this much:
#
#   App image: acreos:deployment-01M0XGXS0P4QN6DYQTE9DA0PF9   (the NEW release)
#    app     7813202b50e6e8  v1022  stopped  1 total, 1 warning
#    app     e827514ae34de8  v1021  stopped  1 total, 1 warning
#    worker  e8239d1b671438  v1022  started
#    worker# 85e209f4412938  v1022  stopped   <- standby, normal
#
# Restarting 7813202b50e6e8 moved it stopped -> starting -> started, then it sat
# at 0/1 checks for ~25s and flyctl gave up:
#
#   Error: failed to restart machine 7813202b50e6e8: failed to wait for health
#   checks to pass: context deadline exceeded
#
# So the VM boots and the CONTAINER runs, but the health check
# (GET :5000/api/health/cached, grace 15s, timeout 5s per fly.toml) never
# passes, so Fly never routes to it and the edge returns 502/timeout. flyctl
# itself is responsive throughout, and status.flyio.net reports all systems
# operational — this is the APPLICATION failing to come up, not the platform.
#
# ROUND 2 IS DIAGNOSIS ONLY. It captures the one thing round 1 lacked: the
# app's own stdout/stderr at boot. It starts an app machine and reads the logs
# on either side of that. It does NOT deploy, destroy, roll back, or scale —
# the right remedy depends entirely on what the boot log says, and guessing at
# a fleet nobody can see is how round 1's restart burned 15 minutes.
#
# Push-triggered rather than workflow_dispatch: this session's GitHub
# integration gets 403 on actions:write (same constraint recorded in
# ses-dkim-fix.yml). Scoped to one file on one branch, deliberately not main,
# so pushing it cannot re-trigger deploy.yml.
# ============================================================================
name: Fly recover (manual one-shot)

on:
  push:
    branches: [claude/acreos-canonical-implementation-1asgvc]
    paths: [".github/workflows/fly-recover.yml"]

concurrency:
  group: fly-recover
  cancel-in-progress: false

permissions: {}

jobs:
  diagnose:
    name: Capture the app boot log
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: acreos
      APP_MACHINE: 7813202b50e6e8
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fleet state
        run: |
          flyctl status --app "$APP" || echo "(status failed)"
          echo
          echo "-------- releases (correct subcommand this time) --------"
          flyctl releases --app "$APP" --image 2>&1 | head -15 || echo "(releases failed)"

      - name: Recent logs BEFORE any action
        run: |
          # --no-tail prints the recent buffer and exits instead of streaming.
          # timeout is belt-and-braces so a streaming flyctl cannot hang the job
          # the way round 1's restart did.
          timeout 90 flyctl logs --app "$APP" --no-tail 2>&1 | tail -120 || echo "(no buffered logs, or timed out)"

      - name: Start the app machine and watch it boot
        run: |
          echo "-------- starting $APP_MACHINE --------"
          # `machine start` returns as soon as the VM is started; unlike
          # `restart` it does NOT block waiting for health checks, so it cannot
          # eat the job's clock.
          flyctl machine start "$APP_MACHINE" --app "$APP" 2>&1 | tail -5 || echo "::warning::start returned non-zero"
          echo "-------- waiting 45s for the process to boot and check --------"
          sleep 45
          echo "-------- machine status (check detail) --------"
          flyctl machine status "$APP_MACHINE" --app "$APP" 2>&1 | tail -40 || true

      - name: Boot logs AFTER start — the decisive evidence
        run: |
          timeout 90 flyctl logs --app "$APP" --no-tail 2>&1 | tail -200 || echo "(no logs captured)"

      - name: Probe, and report state without failing the job
        run: |
          # This job is diagnostic: a non-200 is the expected finding, not an
          # error to abort on. Exiting 0 keeps the log readable in the UI.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://acreos.io/api/version" || echo "000")
            echo "  probe $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo
          echo "Diagnosis complete. Read the boot log above before choosing a remedy."
