# ============================================================================
# Fly recovery — manual one-shot, 2026-08-25/26 production outage. ROUND 3.
# ----------------------------------------------------------------------------
# ROUND 2 (run 32913937976) got the cause down to one line, from
# `flyctl machine status`:
#
#   Event Logs
#    stopped │ exit │ flyd │ 00:10:45.13Z │ exit_code=1, oom_killed=false,
#                                           requested_stop=false
#    started │ start│ flyd │ 00:10:12.514Z
#
# The app starts, runs ~33s, then EXITS 1. Not OOM. Not a requested stop. The
# VM is fine (HostStatus ok, machine started in 1.7s, 2 vCPU / 1024 MB,
# Command ["node","dist/index.cjs"]) — the Node process is crashing during
# startup, so nothing ever listens on :5000 and the edge serves 502:
#
#   "instance refused connection. is your app listening on 0.0.0.0:5000?"
#
# WHAT ROUND 2 COULD NOT GET, and why. server/index.ts:863 catches a startup
# failure and logs "[startup] Fatal error during server initialization" plus
# Name/Message/Stack before exiting 1. That text never appeared, for two
# compounding reasons:
#   1. `flyctl logs --no-tail` returns the current buffer and exits — it ran in
#      0s and the crash was outside that window.
#   2. dist/index.cjs is a MINIFIED single-line bundle, so when Node prints
#      source context for a startup throw it emits one ~400KB line, and Fly
#      truncates log lines at 65,565 chars. The real error sits past the cut.
#
# ROUND 3 fixes both: it STREAMS logs across a boot it triggers itself, and it
# drops any line longer than 2,000 chars so the minified-bundle dump cannot
# drown or truncate the messages that matter.
#
# Still diagnosis only. No deploy, destroy, rollback or scale — the remedy
# follows from the error text, and we are one step from having it.
# ============================================================================
name: Fly recover (manual one-shot)

on:
  push:
    branches: [claude/acreos-canonical-implementation-1asgvc]
    paths: [".github/workflows/fly-recover.yml"]

concurrency:
  group: fly-recover
  cancel-in-progress: false

permissions: {}

jobs:
  boot-log:
    name: Stream the app boot and catch the crash
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: acreos
      APP_MACHINE: 7813202b50e6e8
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stop the machine so the next start is a clean, observable boot
        run: |
          flyctl machine stop "$APP_MACHINE" --app "$APP" 2>&1 | tail -3 || echo "(already stopped)"
          sleep 5

      - name: Stream logs across a boot
        run: |
          # Stream in the background FIRST so nothing in the boot is missed,
          # then trigger the start. 150s covers the observed ~33s crash with
          # wide margin, and timeout guarantees the job cannot hang.
          timeout 150 flyctl logs --app "$APP" > boot.log 2>&1 &
          LOGPID=$!
          sleep 8
          echo "-------- starting $APP_MACHINE --------"
          flyctl machine start "$APP_MACHINE" --app "$APP" 2>&1 | tail -3 || echo "::warning::start non-zero"
          echo "-------- streaming for 150s --------"
          wait $LOGPID || true
          echo "raw lines captured: $(wc -l < boot.log)"

      - name: The crash, with the minified bundle filtered out
        run: |
          # THE FILTER THAT MAKES THIS READABLE: drop any line over 2000 chars.
          # Those are Node printing the one-line minified bundle as source
          # context; every real log line is far shorter.
          echo "======== app log, mega-lines removed ========"
          awk 'length($0) <= 2000' boot.log | tail -150
          echo
          echo "======== lines matching startup/error markers ========"
          awk 'length($0) <= 2000' boot.log \
            | grep -iE '\[startup\]|Fatal error|Name:|Message:|Stack:|Error:|error\]|exit_code|refused connection|listening|Cannot find|ECONNREFUSED|ETIMEDOUT|password|permission denied|SIGTERM|SIGKILL' \
            | tail -60 || echo "(no marker lines matched)"

      - name: Exit event and check state after the boot
        run: |
          flyctl machine status "$APP_MACHINE" --app "$APP" 2>&1 | tail -25 || true
          echo
          echo "Diagnosis round 3 complete."
