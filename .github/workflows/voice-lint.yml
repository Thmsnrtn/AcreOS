name: Voice linter

# Blocking gate on main-bound PRs that touch customer-facing copy. Enforces
# the AcreOS voice doctrine (docs/internal/marketing-os/02-voice-linter.md §4.2):
# no competitor name-drops, no founder-letter tone, "Land Investors"
# terminology, no internal-persona leakage, no dark patterns / FTC-risk claims.

on:
  push:
    branches: [main]
    paths:
      - "client/src/pages/landing/**"
      - "client/src/pages/learn/**"
      - "content/learn/**"
      - "content/editorial/**"
      - "content/briefs/**"
      - "marketing-copy/**"
      - "scripts/voice-lint.mjs"
      - ".github/workflows/voice-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/src/pages/landing/**"
      - "client/src/pages/learn/**"
      - "content/learn/**"
      - "content/editorial/**"
      - "content/briefs/**"
      - "marketing-copy/**"
      - "scripts/voice-lint.mjs"
      - ".github/workflows/voice-lint.yml"

permissions:
  contents: read

concurrency:
  group: voice-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # THIS GATE IS NO LONGER DEPENDENCY-FREE, AND THAT WAS A TRADE.
      #
      # It used to run on bare Node — "pure Node + fs/regex", <10s, no install —
      # and the regex half of that is exactly what changed. `maskTsLike` stripped
      # comments with the two-regex idiom, which eats a whole file when a line
      # comment contains a block-comment opener and cannot tell a comment from a
      # regex literal holding one. On this linter that misfires in the worst
      # direction: prose inside a comment gets scanned as customer-facing copy,
      # or real copy gets blanked and never scanned at all.
      #
      # It now uses the one shared parser-based stripper (scripts/lib/strip-comments.mjs),
      # which imports TypeScript — so node_modules has to exist. The migration
      # landed without this step and the workflow died on ERR_MODULE_NOT_FOUND;
      # branch pushes never run this workflow, so nothing caught it until main.
      #
      # A silent fallback (use the parser when present, regexes otherwise) was
      # rejected outright: a gate that quietly changes what it can see, depending
      # on whether a package resolved, is worse than one that is honestly slower.
      - name: Install dependencies
        run: npm ci

      - name: Run voice linter (full scope)
        run: node scripts/voice-lint.mjs --all
