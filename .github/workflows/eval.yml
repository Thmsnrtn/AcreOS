name: AI Eval Harness

on:
  pull_request:
    paths:
      - 'evals/**'
      - 'server/ai/**'
      - 'server/services/aiRouter.ts'
      - 'server/services/ai*.ts'
      - 'server/services/*ai*.ts'
      # T3-3D sub-item 3 — AI-relevant routing/eval logic also lives in these
      # services; changes here must fire the eval merge-gate too. aiRouter.ts +
      # aiEvalHarness.ts already match the globs above; llmJudge.ts does NOT
      # (no "ai" substring). Listed explicitly so the trigger is unambiguous.
      - 'server/services/aiRouter.ts'
      - 'server/services/llmJudge.ts'
      - 'server/services/aiEvalHarness.ts'
      # Tahoe E7 — the eval gate must fire on actual Pax prompt/persona changes.
      - 'server/ai/paxPromptVersions.ts'
      - 'server/services/pax/**'
      - 'server/services/pax*.ts'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Audit F-08-2: eval BOTH the default model (Sonnet) AND the model that
    # actually serves the free trial + the most-common data_lookup_restate turn
    # (Haiku, per shared/schema/solene-chat-config.ts + server/ai/paxModelTier.ts).
    # An eval whose model differs from the served model gates nothing. Each
    # matrix leg runs on its own isolated runner, so report dirs don't collide.
    strategy:
      fail-fast: false
      matrix:
        model: ['claude-sonnet-4-6', 'claude-haiku-4-5-20251001']
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run eval on PR head
        id: eval-pr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_INTEGRATIONS_OPENROUTER_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENROUTER_API_KEY }}
        run: |
          npm run eval -- --model ${{ matrix.model }} --report-dir evals/reports/pr
          PR_SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/pr/latest.json','utf8')).totals.avgOverall.toFixed(4))")
          echo "pr_score=$PR_SCORE" >> "$GITHUB_OUTPUT"

      - name: Checkout main into worktree
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/main origin/main

      - name: Run eval on main baseline
        id: eval-main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_INTEGRATIONS_OPENROUTER_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENROUTER_API_KEY }}
        run: |
          # Re-use same node_modules; copy main's evals/ over and run.
          mkdir -p evals/reports/main
          if [ -f /tmp/main/evals/run-eval.ts ]; then
            cp -r /tmp/main/evals/* evals_main_tmp/ 2>/dev/null || true
            mkdir -p evals_main_tmp
            cp -r /tmp/main/evals/. evals_main_tmp/
            npx tsx evals_main_tmp/run-eval.ts --model ${{ matrix.model }} --prompts evals_main_tmp/golden-set.json --report-dir evals/reports/main || true
          fi
          if [ -f evals/reports/main/latest.json ]; then
            MAIN_SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/main/latest.json','utf8')).totals.avgOverall.toFixed(4))")
          else
            MAIN_SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/pr/latest.json','utf8')).totals.avgOverall.toFixed(4))")
          fi
          echo "main_score=$MAIN_SCORE" >> "$GITHUB_OUTPUT"

      - name: Compute regression
        id: regression
        run: |
          PR=${{ steps.eval-pr.outputs.pr_score }}
          MAIN=${{ steps.eval-main.outputs.main_score }}
          DELTA=$(node -e "console.log(((${PR} - ${MAIN}) * 100).toFixed(2))")
          THRESHOLD=-5
          echo "delta_pct=$DELTA" >> "$GITHUB_OUTPUT"
          PASS=$(node -e "console.log(${DELTA} >= ${THRESHOLD} ? 'true' : 'false')")
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = '${{ steps.eval-pr.outputs.pr_score }}';
            const main = '${{ steps.eval-main.outputs.main_score }}';
            const delta = '${{ steps.regression.outputs.delta_pct }}';
            const pass = '${{ steps.regression.outputs.pass }}' === 'true';
            const emoji = pass ? '✅' : '❌';
            const verdict = pass
              ? `Within the 5% regression budget.`
              : `**Regression > 5% — blocking merge.**`;
            const body = [
              `### ${emoji} AI eval harness — model: \`${{ matrix.model }}\``,
              ``,
              `| metric | value |`,
              `| --- | --- |`,
              `| PR score | **${pr}** |`,
              `| main baseline | ${main} |`,
              `| delta | ${delta}% |`,
              ``,
              verdict,
              ``,
              `Full report uploaded as a workflow artifact (\`evals/reports/pr/latest.json\`).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports-${{ matrix.model }}
          path: evals/reports
          retention-days: 14

      - name: Fail on regression
        if: steps.regression.outputs.pass != 'true'
        run: |
          echo "Eval regression > 5% — failing."
          exit 1

  # ─── Tahoe E7 — absolute-threshold prompt-change gate ──────────────────────
  # The `eval` job above is a RELATIVE PR-vs-main regression check. This job is
  # the ABSOLUTE gate: it runs the curated golden set through the LLM judge and
  # fails non-zero (EvalGateRejectedError) when avgOverall drops below the
  # EVAL_GATE_THRESHOLD floor. With no ANTHROPIC_API_KEY it gracefully skips
  # (exit 0) so fork PRs without secrets don't false-fail.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run prompt-change eval gate (curated golden set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_GATE_THRESHOLD: '0.65'
          # No DATABASE_URL in CI → verdict persistence is skipped (best-effort).
        run: npm run eval:gate -- --json
