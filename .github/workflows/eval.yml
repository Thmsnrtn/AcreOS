name: AI Eval Harness

on:
  pull_request:
    paths:
      - 'evals/**'
      - 'server/ai/**'
      - 'server/services/aiRouter.ts'
      - 'server/services/ai*.ts'
      - 'server/services/*ai*.ts'
      # T3-3D sub-item 3 — AI-relevant routing/eval logic also lives in these
      # services; changes here must fire the eval merge-gate too. aiRouter.ts +
      # aiEvalHarness.ts already match the globs above; llmJudge.ts does NOT
      # (no "ai" substring). Listed explicitly so the trigger is unambiguous.
      - 'server/services/aiRouter.ts'
      - 'server/services/llmJudge.ts'
      - 'server/services/aiEvalHarness.ts'
      # Tahoe E7 — the eval gate must fire on actual Pax prompt/persona changes.
      - 'server/ai/paxPromptVersions.ts'
      - 'server/services/pax/**'
      - 'server/services/pax*.ts'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The SERVED model path (evals/servedPath.ts): the prompt Pax's chat
    # composes, sent over OpenRouter to the model production's tier rule picks
    # (served:free → the trial / Free tier) and to openai/gpt-4o (the vision
    # route). Until 2026-10-09 this matrix named claude-sonnet-4-6 and
    # claude-haiku-4-5 directly, ran with every model key empty, and printed a
    # stubbed avgOverall of exactly 0.5555 on every PR. With no OpenRouter key
    # the runner now reports NOT MEASURED and there is no score to compare.
    # Cost bound per measured run (repo rate table, replies at max_tokens):
    # served:free ≈ $0.54, openai/gpt-4o ≈ $1.09; doubled when the main
    # baseline is measured too.
    strategy:
      fail-fast: false
      matrix:
        target: ['served:free', 'openai/gpt-4o']
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run eval on PR head
        id: eval-pr
        env:
          AI_INTEGRATIONS_OPENROUTER_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENROUTER_API_KEY }}
        run: |
          npm run eval -- --model '${{ matrix.target }}' --report-dir evals/reports/pr
          MEASURED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/pr/latest.json','utf8')).measured === true)")
          echo "measured=$MEASURED" >> "$GITHUB_OUTPUT"
          if [ "$MEASURED" = "true" ]; then
            PR_SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/pr/latest.json','utf8')).totals.avgOverall.toFixed(4))")
            echo "pr_score=$PR_SCORE" >> "$GITHUB_OUTPUT"
          else
            echo "### AI eval (${{ matrix.target }}): NOT MEASURED" >> "$GITHUB_STEP_SUMMARY"
            node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/pr/latest.json','utf8')).reason)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run eval on main baseline
        id: eval-main
        if: steps.eval-pr.outputs.measured == 'true'
        env:
          AI_INTEGRATIONS_OPENROUTER_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENROUTER_API_KEY }}
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/main origin/main
          # Only a main that has the served-path runner can be compared.
          if [ -f /tmp/main/evals/servedPath.ts ]; then
            ( cd /tmp/main && ln -s "$GITHUB_WORKSPACE/node_modules" node_modules && npx tsx evals/run-eval.ts --model '${{ matrix.target }}' --report-dir "$GITHUB_WORKSPACE/evals/reports/main" ) || true
          fi
          if [ -f evals/reports/main/latest.json ] && node -e "process.exit(JSON.parse(require('fs').readFileSync('evals/reports/main/latest.json','utf8')).measured === true ? 0 : 1)"; then
            MAIN_SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('evals/reports/main/latest.json','utf8')).totals.avgOverall.toFixed(4))")
            echo "main_score=$MAIN_SCORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute regression
        id: regression
        if: steps.eval-main.outputs.main_score != ''
        run: |
          PR=${{ steps.eval-pr.outputs.pr_score }}
          MAIN=${{ steps.eval-main.outputs.main_score }}
          DELTA=$(node -e "console.log(((${PR} - ${MAIN}) * 100).toFixed(2))")
          echo "delta_pct=$DELTA" >> "$GITHUB_OUTPUT"
          PASS=$(node -e "console.log(${DELTA} >= -5 ? 'true' : 'false')")
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const measured = '${{ steps.eval-pr.outputs.measured }}' === 'true';
            const pr = '${{ steps.eval-pr.outputs.pr_score }}';
            const main = '${{ steps.eval-main.outputs.main_score }}';
            const delta = '${{ steps.regression.outputs.delta_pct }}';
            const pass = '${{ steps.regression.outputs.pass }}';
            const target = '${{ matrix.target }}';
            const body = !measured
              ? [
                  `### ⚠️ AI eval — \`${target}\`: NOT MEASURED`,
                  ``,
                  `No OpenRouter key is available to this job, so the served model path was not called and there is no score.`,
                  `This is not a pass. (Before 2026-10-09 this job printed a stubbed 0.5555 here.)`,
                ].join('\n')
              : [
                  `### AI eval — \`${target}\` (served path)`,
                  ``,
                  `| metric | value |`,
                  `| --- | --- |`,
                  `| PR score | **${pr}** |`,
                  `| main baseline | ${main || 'not measured (main has no served-path runner yet)'} |`,
                  `| delta | ${delta ? delta + '%' : 'n/a'} |`,
                  ``,
                  pass === 'false' ? `**Regression > 5% — blocking merge.**` : (pass === 'true' ? `Within the 5% regression budget.` : `No baseline to compare against.`),
                ].join('\n');
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports-${{ strategy.job-index }}
          path: evals/reports
          retention-days: 14

      - name: Fail on regression
        if: steps.regression.outputs.pass == 'false'
        run: |
          echo "Eval regression > 5% — failing."
          exit 1

  # ─── Tahoe E7 — absolute-threshold prompt-change gate ──────────────────────
  # The `eval` job above is a RELATIVE PR-vs-main regression check. This job is
  # the ABSOLUTE gate: it runs the curated golden set through the LLM judge and
  # fails non-zero (EvalGateRejectedError) when avgOverall drops below the
  # EVAL_GATE_THRESHOLD floor. With no ANTHROPIC_API_KEY it gracefully skips
  # (exit 0) so fork PRs without secrets don't false-fail.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run prompt-change eval gate (curated golden set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_GATE_THRESHOLD: '0.65'
          # No DATABASE_URL in CI → verdict persistence is skipped (best-effort).
        run: npm run eval:gate -- --json
