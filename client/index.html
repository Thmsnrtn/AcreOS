    <!-- viewport-fit=cover is not decoration: WebKit resolves the
         safe-area-inset-* environment variables to 0 without it. This repo has
         35 deliberate env(safe-area-inset-*) declarations across 19 files —
         the mobile bottom navs, the command drawer, PageShell's paddingTop,
         .mobile-safe-content, Inbox, Maps, DriveMode, CourthouseMode,
         PullToRefresh — and every one of them was inert on the exact devices
         it was written for (2026-09-04 review). With
         apple-mobile-web-app-status-bar-style=black-translucent below, the
         installed PWA also renders under the status bar, so the top inset is
         load-bearing too. Pinned by tests/unit/safeAreaInsetsResolve.test.ts.
         initial-scale=1, not 1.0 — same value, and the form every WebKit doc
         uses. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C45C3E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AcreOS" />

    <!-- iOS PWA splash screens. iOS uses apple-touch-startup-image to
         render a native-feeling launch screen when the app is opened from
         the home screen. Without these, iOS falls back to a white flash
         before the app shell paints. Each media query matches a specific
         iPhone screen size + pixel density combination (portrait only —
         AcreOS uses portrait-primary orientation).

         Sizes are: [device-width × device-height] at [dpr].
         Source: https://developer.apple.com/design/human-interface-guidelines/
         Covers: iPhone 16 Pro Max, 16 Pro, 16/15/14 Plus, 15/14 Pro Max,
                 14 Pro, 13/12 Pro Max, 11 Pro Max, XS Max,
                 11/XR, 11 Pro/XS/X, 12/13/14, 12/13 mini,
                 SE 3rd gen, SE 2nd gen / 8 / 7 / 6s / 6

         All point to the same branded splash — the brand terracotta with
         the AcreOS wordmark. Background matches manifest background_color
         (#EDE3D0 Bedrock warm). The image itself should be 2732×2048 to
         cover the largest viewport at 3x; we use the 512x512 app icon
         centred on the brand background as a graceful fallback. -->
    <!-- iPhone 16 Pro Max (430pt × 932pt @3x) -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1290x2796.png">

    <script data-csp-nonce>
      // Prevent dark mode FOUC — resolve the theme mode before React renders.
      // Mirrors theme-context.tsx: the canonical config is JSON under
      // 'acreos-theme-config' with a `mode` of 'light' | 'dark' | 'auto';
      // 'acreos-theme' is the legacy raw light|dark fallback. 'auto'/absent
      // defers to the OS prefers-color-scheme, exactly like resolvedMode.
      try {
        var mode = null;
        var raw = localStorage.getItem('acreos-theme-config');
        if (raw) {
          var m = JSON.parse(raw).mode;
          if (m === 'system') m = 'auto';
          if (m === 'light' || m === 'dark' || m === 'auto') mode = m;
        }
        if (!mode) {
          var legacy = localStorage.getItem('acreos-theme');
          if (legacy === 'light' || legacy === 'dark') mode = legacy;
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || ((mode === 'auto' || !mode) && prefersDark);
        if (isDark) document.documentElement.classList.add('dark');
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
