<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AcreOS" />
    <meta name="description" content="AcreOS is the operating system for property investors — land flippers, note investors, fix-and-flippers, wholesalers, subdividers, tax-delinquent buyers, and buy-and-hold landlords. Pull lists, run comps, send mail, draft replies, and close deals with AI agents in one platform." />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AcreOS" />
    <meta property="og:url" content="https://acreos.io/" />
    <meta property="og:title" content="AcreOS — The Operating System for Property Investors" />
    <meta property="og:description" content="One platform for every investor type — find deals, run comps, send mail, draft replies, close deals, and service notes with AI agents that act on your behalf." />
    <meta property="og:image" content="https://acreos.io/images/aerial_view_wide_hor_0f1000c4.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Aerial view of open land — one of many asset types property investors hunt, analyze, and close on AcreOS." />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AcreOS — The Operating System for Property Investors" />
    <meta name="twitter:description" content="One platform for every investor type — find deals, run comps, send mail, draft replies, close deals, and service notes with AI agents that act on your behalf." />
    <meta name="twitter:image" content="https://acreos.io/images/aerial_view_wide_hor_0f1000c4.jpg" />
    <meta name="twitter:image:alt" content="Aerial view of open land — one of many asset types property investors hunt, analyze, and close on AcreOS." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Warm the TLS connection to Clerk + Mapbox before the app code runs.
         Saves ~100-150ms on the first auth/map call (DNS+TCP+TLS handshake
         happens in parallel with the JS bundle download instead of after). -->
    <link rel="preconnect" href="https://clerk.acreos.io" crossorigin>
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
    <link rel="dns-prefetch" href="https://events.mapbox.com">
    <title>AcreOS — The Operating System for Property Investors</title>
    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AcreOS",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "CRM",
      "operatingSystem": "Web",
      "description": "Operating system for property investors — find deals, run comps, send mail, draft replies, close deals, manage seller-financed notes, and track rehabs. Built for land flippers, note investors, fix-and-flippers, wholesalers, subdividers, tax-delinquent buyers, and buy-and-hold landlords.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "url": "https://acreos.io/pricing"
      },
      "creator": {
        "@type": "Organization",
        "name": "AcreOS",
        "url": "https://acreos.io"
      }
    }
    </script>
    <!-- Homestead typography — Fraunces (variable serif w/ optical size, used
         on the public landing's serif headlines) and Inter (sans body, used
         throughout the app and landing). Now self-hosted at /fonts/* —
         declarations live in client/src/fonts.css. Self-hosted to avoid
         service-worker / cross-origin failures on the Google Fonts request. -->
    <link rel="preload" href="/fonts/Fraunces-VariableFont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-VariableFont.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <script data-csp-nonce>
      // Prevent dark mode FOUC — apply theme before React renders
      try {
        const t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
