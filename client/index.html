<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B4513" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AcreOS" />
    <meta name="description" content="The AI-powered platform for Land Investors — find motivated sellers, analyze parcels, send direct mail, and close deals in one platform." />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AcreOS — The AI-Powered Platform for Land Investors" />
    <meta property="og:description" content="Find motivated sellers, analyze parcels, send direct mail, and close land deals — with AI-powered automation." />
    <meta property="og:image" content="/pwa-192x192.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AcreOS — The AI-Powered Platform for Land Investors" />
    <meta name="twitter:description" content="Find motivated sellers, analyze parcels, send direct mail, and close land deals — with AI-powered automation." />
    <meta name="twitter:image" content="/pwa-192x192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AcreOS — The AI-Powered Platform for Land Investors</title>
    <!-- Preconnect for Google Fonts (used by theme customizer on-demand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Core app uses system font stack; theme/white-label fonts are loaded dynamically -->
  </head>
  <body>
    <script data-csp-nonce>
      // Prevent dark mode FOUC — apply theme before React renders
      try {
        const t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
