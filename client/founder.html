<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The FOUNDER shell (P1-9 / X-2): the entry of the second Vite output,
         dist/founder, served by server/static.ts for /founder, /founder/* and
         the founder-gated pages at non-/founder URLs. The customer shell is
         client/index.html. This surface is private — noindex, no SEO head, no
         structured data, no social cards.

         viewport-fit=cover is not decoration: WebKit resolves the
         safe-area-inset-* environment variables to 0 without it (see
         client/index.html and tests/unit/safeAreaInsetsResolve.test.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F8F8F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111B18" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AcreOS Founder" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://clerk.acreos.io" crossorigin>
    <title>AcreOS — Founder</title>
  </head>
  <body>
    <script data-csp-nonce data-appearance-boot>
      // Resolve the personal colorway + display mode BEFORE React renders, so
      // the first paint is already the right palette (no flash of the old
      // one). Identical to the boot script in client/index.html — it mirrors
      // normalizeAppearance() in shared/appearance.ts, and
      // tests/unit/appearanceContract.test.ts keeps the two from drifting.
      try {
        var COLORWAYS = ['fieldstone', 'bedrock', 'meridian'];
        var LEGACY = { homestead: 'bedrock', dirtpass: 'bedrock', quarry: 'fieldstone', nocturne: 'fieldstone', meadow: 'fieldstone', slate: 'fieldstone' };
        var theme = 'fieldstone';
        var mode = 'auto';
        var raw = localStorage.getItem('acreos-theme-config');
        if (raw) {
          var cfg = null;
          try { cfg = JSON.parse(raw); } catch (e) { cfg = null; }
          if (cfg && typeof cfg === 'object') {
            var t = cfg.theme;
            if (typeof t === 'string') {
              if (COLORWAYS.indexOf(t) !== -1) theme = t;
              else if (Object.prototype.hasOwnProperty.call(LEGACY, t)) theme = LEGACY[t];
            }
            var m = cfg.mode;
            if (m === 'system') m = 'auto';
            if (m === 'light' || m === 'dark' || m === 'auto') mode = m;
          }
        } else {
          var legacy = localStorage.getItem('acreos-theme');
          if (legacy === 'light' || legacy === 'dark') mode = legacy;
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        if (isDark) root.classList.add('dark');
        root.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/founder-main.tsx"></script>
  </body>
</html>
