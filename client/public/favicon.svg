<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    AcreOS app icon — Fieldstone identity (2026-10-18).

    The one AcreOS mark (client/src/components/acreos-logo.tsx — the same two
    paths): an outer peaked parcel line in limestone and an inner brass
    chevron, on the Fieldstone forest. Static installed icons always use the
    default Fieldstone identity, whatever colorway a person picks in the app.

    Canvas is FULL-BLEED forest. iOS and Android apply their own squircle /
    adaptive mask, so no rounded corners are baked in. The glyph spans the
    central ~49% (well inside every platform's safe area). The companion
    favicon-maskable.svg shrinks it further for aggressive Android masks.

    Rasterized by `node scripts/generate-icons.mjs` — never edit the PNGs.
  -->
  <rect width="1024" height="1024" fill="#123B32"/>
  <g transform="translate(224 224) scale(18)">
    <path d="M3.5 27 L13.4 5 L18.6 5 L28.5 27" fill="none" stroke="#F2F3EB" stroke-width="2.2" stroke-linejoin="miter" stroke-linecap="square"/>
    <path d="M10.6 27 L17.3 12.6 L24 27" fill="none" stroke="#D2B77C" stroke-width="2.2" stroke-linejoin="miter" stroke-linecap="square"/>
  </g>
</svg>
