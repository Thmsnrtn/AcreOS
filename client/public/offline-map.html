<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f1d1a" />
  <title>Offline field map — AcreOS</title>
  <!--
    The offline field map (W5b, Map door). Opens with no network and no sign-in
    round trip: it reads ONLY what "Save this area for offline" stored on this
    device (IndexedDB acreos-offline-maps + Cache Storage offline-map-tiles-v1),
    served by the service worker. Plain HTML/JS on purpose — the app shell's
    auth and chunk loading need the network; a field visit in airplane mode
    does not have it.
  -->
  <style>
    :root { --bg: #f7f5f2; --fg: #1f1d1a; --muted: #5f5a52; --line: #d8d2c8; --brand: #8a4a26; --warn-bg: #fff4d6; --warn-fg: #6b4b00; --parcel: #c2410c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #171512; --fg: #f3efe9; --muted: #b5ada1; --line: #3a352e; --brand: #e0a37c; --warn-bg: #3d3216; --warn-fg: #f5d58a; --parcel: #fb923c; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    header h1 { font-size: 16px; margin: 0; flex: 1 1 auto; }
    .since { width: 100%; background: var(--warn-bg); color: var(--warn-fg); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
    select, button { font: inherit; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    #map { position: relative; overflow: hidden; height: calc(100% - 210px); min-height: 280px; touch-action: none; background: #444; }
    #tiles, #overlay { position: absolute; left: 0; top: 0; }
    #tiles img { position: absolute; width: 256px; height: 256px; user-select: none; -webkit-user-drag: none; }
    #controls { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
    #controls button { background: var(--bg); width: 44px; padding: 0; }
    #facts { padding: 10px 16px; font-size: 13px; color: var(--muted); max-height: 140px; overflow: auto; }
    #facts strong { color: var(--fg); }
    footer { padding: 4px 16px 12px; font-size: 11px; color: var(--muted); }
    .empty { padding: 24px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Offline field map</h1>
    <label for="area" style="position:absolute;left:-9999px">Saved area</label>
    <select id="area" data-testid="offline-area-select"></select>
    <div class="since" id="since" role="status" data-testid="offline-since"></div>
  </header>
  <div id="map" data-testid="offline-map">
    <div id="tiles"></div>
    <svg id="overlay" aria-hidden="true"></svg>
    <div id="controls">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="locate" aria-label="Show my location">◎</button>
    </div>
  </div>
  <div id="facts" data-testid="offline-facts">Tap a parcel to see its facts.</div>
  <footer id="attribution" data-testid="offline-attribution"></footer>
  <script src="/offline-map.js"></script>
</body>
</html>
