version: "3.9"

# Smoke-test stack: postgres + redis + app
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.test.yml down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acreos_test
      POSTGRES_PASSWORD: acreos_test
      POSTGRES_DB: acreos_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acreos_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://acreos_test:acreos_test@db:5432/acreos_test
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: test-session-secret-minimum-32-chars-long-enough
      APP_URL: http://localhost:5000
      DISABLE_BACKGROUND_JOBS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  smoke-test:
    image: curlimages/curl:latest
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./scripts/docker-smoke-test.sh:/smoke-test.sh:ro
    entrypoint: ["/bin/sh", "/smoke-test.sh"]
    environment:
      APP_URL: http://app:5000

volumes: {}
