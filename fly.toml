app = 'acreos'
primary_region = 'iad'

[build]
  # VITE_GIT_SHA is baked into the client bundle for Sentry release
  # tagging + source-map symbolication. Pass via:
  #   fly deploy --build-arg VITE_GIT_SHA=$(git rev-parse HEAD)
  # SENTRY_AUTH_TOKEN must be set as a fly secret OR passed at deploy
  # time so `sentry-cli sourcemaps upload` runs during the build step.
  [build.args]
    VITE_GIT_SHA = ""

[deploy]
  # Idempotent schema patch runs in a one-shot release VM before new
  # machines take traffic. See scripts/migrate.mjs for details.
  release_command = "node scripts/migrate.mjs"

[env]
  NODE_ENV = 'production'
  PORT = '5000'

# ──────────────────────────────────────────────────────────────────────
# Process groups — Wave: cost. The customer-facing app machines stay
# lean and never block on PDF render / eval / image / embedding /
# recognition / 1099 batch work. Those effects flow through the
# `outbox` table and are consumed by the worker process group.
#
# `app`    — Express + WebSocket. Public HTTP. Performance VM, 2 CPUs.
# `worker` — server/worker.ts. No public ports. Shared CPU, 1 GB RAM.
#            Polls outbox every 5s for pdf_render, eval_run,
#            image_process, embedding_refresh, recognition_run,
#            1099_batch_generate.
# ──────────────────────────────────────────────────────────────────────
[processes]
  app = "node dist/index.cjs"
  worker = "node dist/worker.cjs"

[http_service]
  internal_port = 5000
  force_https = true
  # Phase 0 (2026-05-22) — zero-capital survival mode. The previous config
  # kept 2 performance-2x machines hot 24/7 (~$576/mo) for HA. With $0
  # working capital pre-launch, we trade 1–2s cold-start latency on the
  # first request after idle for $560/mo of recovered runway. Fly's
  # auto_stop suspends machines after ~5 minutes of no traffic; the next
  # request triggers a wake. Revisit at $200 MRR (revenue-trigger ladder
  # in docs/financial-mail-platform/PLAN.md).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    # Scale out at 70% concurrency, scale in at 20%
    soft_limit = 200
    hard_limit = 250

[checks]
  [checks.health]
    port = 5000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health/cached'
    processes = ['app']

# Default VM (app process group). Phase 0: shared-cpu-4x (2 shared vCPU,
# 1 GB RAM) is the smallest VM the Node + Express + Drizzle bundle
# starts reliably on. Combined with auto_stop_machines=suspend above,
# typical idle-month cost is <$5/mo. When MRR crosses $200, the
# revenue-trigger ladder bumps this back up.
[[vm]]
  size = 'shared-cpu-4x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  processes = ['app']

# Worker VM — shared CPU is fine because PDF render / eval batches are
# bursty + tolerant of contention. min_machines_running = 1 keeps a
# single drainable consumer hot at all times. Bumped from 1×/1GB to
# 2×/2GB to absorb the scheduled-jobs catalogue that now also runs
# here (formerly gated off the app by DISABLE_BACKGROUND_JOBS) — drip
# campaigns + autonomous executor + onboarding sweeper + briefings
# share this machine with the outbox drain loop.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  processes = ['worker']
  min_machines_running = 1
